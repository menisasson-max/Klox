    function initLevel() {
        clearSelection();
        steps = 0;
        gameOver = false;
        popIndex = null;
        lineCombo = 0;

        scoreAnimId++; // stop any score count still running from the last board
        document.querySelectorAll('.lvlup').forEach(el => el.remove());
        level = levelInfo(progress.points).L;
        params = levelParams(boardDifficulty());
        N = params.N;
        colors = ALL_COLORS.slice(0, N);
        shapes = ALL_SHAPES.slice(0, N);
        totalTime = params.time;
        timeLeft = totalTime;
        document.getElementById('timerDisplay').classList.remove('extended');
        spentBeforeReset = 0;
        extended = false;
        updateTimerUI();

        // Variable reward: one board in eight is golden and pays double
        golden = progress.played > 0 && Math.random() < 0.125;

        const bc = document.getElementById('boardContainer');
        bc.className = 'board-container size-' + N + (golden ? ' golden' : '');
        const grid = document.getElementById('boardGrid');
        grid.style.gridTemplateColumns = `repeat(${N}, minmax(0, 1fr)) var(--dot-track)`;
        grid.style.gridTemplateRows = `var(--dot-track) repeat(${N}, minmax(0, 1fr))`;
        grid.classList.toggle('no-guides', !params.guides);
        document.getElementById('chipUnique').style.display = params.unique ? '' : 'none';
        updateHud();

        const cells = N * N;
        const solution = generateValidBoard(N);
        const order = shuffle([...Array(cells).keys()]);
        const missingPos = order.slice(0, params.missing);

        boardState = Array(cells).fill(null);
        trayState = [];
        let idCounter = 1;

        order.forEach((pos, i) => {
            const item = { ...solution[pos], id: 't_' + idCounter++ };
            if (i < params.missing) {
                trayState.push(item);
            } else {
                item.locked = true;
                boardState[pos] = item;
            }
        });

        // Scrambled: some of the missing tiles start on the board, in a wrong slot.
        const s = Math.min(params.scrambled, missingPos.length - 1);
        if (s > 0) {
            const from = missingPos.slice(0, s);
            // Rotate them among their own slots, or (one tile) put it in another empty slot
            const to = s >= 2 ? [...from.slice(1), from[0]] : [missingPos[1]];
            from.forEach((p, k) => {
                const want = solution[p];
                const idx = trayState.findIndex(t => t.color === want.color && t.shape === want.shape);
                boardState[to[k]] = trayState.splice(idx, 1)[0];
            });
        }

        // Roughly the fewest moves a perfect player needs
        minSteps = params.missing;

        shuffle(trayState);
        initialSnap = snapshot();
        undoStack = [];
        wheelAngle = null; // centre the wheel on the middle tile
        validLines = new Set();
        clashLines = new Set();
        render(true);
        setPaused(false);
        if (golden) { toast('✨ לוח זהב!', 'הנקודות על הלוח הזה כפולות'); Sound.coin(); }
    }

    /* ============================
       Rendering
       ============================ */
    function createTileElement(data, isSelected) {
        const tile = document.createElement('div');
        tile.className = 'tile' + (isSelected ? ' selected' : '') + (data.locked ? ' locked-tile' : '');

        let shape;
        if (style === 'animals') {
            const NS = 'http://www.w3.org/2000/svg';
            shape = document.createElementNS(NS, 'svg');
            shape.setAttribute('viewBox', '0 0 100 100');
            shape.setAttribute('class', 'shape animal');
            shape.style.color = data.color; // the sprite paints with currentColor
            const use = document.createElementNS(NS, 'use');
            use.setAttribute('href', '#a-' + ANIMAL_FOR[data.shape]);
            shape.appendChild(use);
        } else {
            shape = document.createElement('div');
            shape.className = 'shape ' + data.shape;
            shape.style.backgroundColor = data.color; // inline so clip-path shapes are coloured
        }
        tile.appendChild(shape);

        if (data.locked) {
            const lock = document.createElement('div');
            lock.innerHTML = `<svg class="lock-svg" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;
            tile.appendChild(lock.firstChild);
        }
        return tile;
    }

    function render(silent = false) {
        // 1. Tray wheel — the angle survives re-renders
        const trayEl = document.getElementById('traySlots');
        trayEl.innerHTML = '';
        trayState.forEach((item) => {
            const slot = document.createElement('div');
            slot.className = 'tray-slot';
            const isSel = selectedSource === 'tray' && selectedId === item.id;
            const tile = createTileElement(item, isSel);
            tile.dataset.src = 'tray';
            tile.dataset.id = item.id;
            tile.addEventListener('click', (e) => { e.stopPropagation(); handleTrayClick(item.id); });
            slot.appendChild(tile);
            trayEl.appendChild(slot);
        });
        if (trayState.length === 0) {
            const empty = document.createElement('span');
            empty.className = 'tray-empty';
            empty.innerText = 'המגש ריק — גרור לכאן אריח כדי להחזיר אותו';
            trayEl.appendChild(empty);
        }
        document.getElementById('trayCountDisplay').innerText = `${trayState.length} נותרו`;
        layoutWheel();
        updateToolButtons();

        // 2. Board
        const grid = document.getElementById('boardGrid');
        grid.innerHTML = '';

        for (let c = 0; c < N; c++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-col-${c}`;
            dot.style.gridRow = '1';
            dot.style.gridColumn = `${c + 1}`;
            grid.appendChild(dot);
        }

        boardState.forEach((item, index) => {
            const r = Math.floor(index / N);
            const c = index % N;

            if (c === 0) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.id = `dot-row-${r}`;
                dot.style.gridRow = `${r + 2}`;
                dot.style.gridColumn = `${N + 1}`;
                grid.appendChild(dot);
            }

            const slot = document.createElement('div');
            slot.className = 'slot' + (item?.locked ? ' locked' : '');
            slot.style.gridRow = `${r + 2}`;
            slot.style.gridColumn = `${c + 1}`;
            slot.dataset.drop = 'board';
            slot.dataset.index = index;

            if (item) {
                const isSel = selectedSource === 'board' && selectedIndex === index;
                const tile = createTileElement(item, isSel);
                if (popIndex === index) tile.classList.add('pop');
                if (!item.locked) {
                    tile.dataset.src = 'board';
                    tile.dataset.index = index;
                }
                tile.addEventListener('click', (e) => { e.stopPropagation(); handleBoardClick(index, tile); });
                slot.appendChild(tile);
            } else {
                slot.addEventListener('click', () => handleBoardClick(index, slot));
            }
            grid.appendChild(slot);
        });
        popIndex = null;

        validateState(silent);
    }

    /* ============================
       Tray wheel geometry

       Tiles sit on a circle whose centre is far below the screen, so only a
       shallow arc shows. Tile i is at angle wheelAngle + i·step from the top;
       angle 0 is the top centre. The first tile is on the right (RTL), the
       rest run leftward and down out of sight.
       ============================ */
    let wheelAngle = null;
    let wheel = { R: 300, step: 0.2, cx: 0, cy: 0 };
    let wheelAnim = null;
    let wheelNearest = -1;
    const WHEEL_PITCH = 64;    // px along the arc between tiles

    function wheelMinAngle() {
        return -Math.max(0, trayState.length - 1) * wheel.step;
    }

    function setWheelAngle(a) {
        wheelAngle = Math.max(wheelMinAngle(), Math.min(0, a));
        positionWheelTiles();
        // a soft click each time a new tile reaches the top
        const nearest = Math.round(-wheelAngle / wheel.step);
        if (nearest !== wheelNearest) {
            if (wheelNearest !== -1 && (drag?.mode === 'spin' || wheelAnim)) { Sound.click(); buzz(2); }
            wheelNearest = nearest;
        }
    }

    function layoutWheel() {
        const box = document.getElementById('trayContainer');
        const W = box.clientWidth || 360;
        const apexY = box.clientHeight - 60; // centre of the top tile, from the top of the tray
        wheel.R = Math.max(240, Math.min(440, W * 0.85));
        wheel.step = WHEEL_PITCH / wheel.R;
        wheel.cx = W / 2;
        wheel.cy = apexY + wheel.R;

        const disc = document.getElementById('wheelDisc');
        const dr = wheel.R + 44;
        disc.style.width = disc.style.height = dr * 2 + 'px';
        disc.style.left = (wheel.cx - dr) + 'px';
        disc.style.top = (wheel.cy - dr) + 'px';

        if (wheelAngle === null) wheelAngle = -Math.floor((trayState.length - 1) / 2) * wheel.step;
        wheelNearest = -1;
        setWheelAngle(wheelAngle);
    }

    function positionWheelTiles() {
        const slots = document.querySelectorAll('#traySlots .tray-slot');
        slots.forEach((slot, i) => {
            const th = wheelAngle + i * wheel.step;
            if (Math.abs(th) > 1.1) { slot.style.visibility = 'hidden'; return; }
            slot.style.visibility = '';
            const x = wheel.cx - wheel.R * Math.sin(th);
            const y = wheel.cy - wheel.R * Math.cos(th);
            // tiles near the top are a touch bigger, so the "current" one stands out
            const sc = 1.08 - 0.22 * Math.min(1, Math.abs(th) / (wheel.step * 3));
            slot.style.transform = `translate(${x}px, ${y}px) scale(${sc.toFixed(3)})`;
        });
        document.getElementById('wheelDisc').style.setProperty('--spin', (-wheelAngle) + 'rad');
    }

    function stopWheelMotion() {
        if (wheelAnim) cancelAnimationFrame(wheelAnim);
        wheelAnim = null;
    }

    // Coast with the release velocity (rad/ms), then settle with a tile on top.
    function spinWheel(v) {
        stopWheelMotion();
        let last = performance.now();
        const frame = (now) => {
            const dt = Math.min(32, now - last);
            last = now;
            if (Math.abs(v) > 0.00004) {
                const before = wheelAngle;
                setWheelAngle(wheelAngle + v * dt);
                if (wheelAngle === before) v = 0; // hit an end
                v *= Math.pow(0.93, dt / 16);
            } else {
                const target = Math.round(wheelAngle / wheel.step) * wheel.step;
                const d = target - wheelAngle;
                if (Math.abs(d) < 0.0006) { setWheelAngle(target); wheelAnim = null; return; }
                setWheelAngle(wheelAngle + d * 0.25);
            }
            wheelAnim = requestAnimationFrame(frame);
        };
        wheelAnim = requestAnimationFrame(frame);
    }

    window.addEventListener('resize', () => layoutWheel());

    // A mouse wheel turns the tray wheel
    document.getElementById('trayContainer').addEventListener('wheel', (e) => {
        e.preventDefault();
        stopWheelMotion();
        setWheelAngle(wheelAngle - (e.deltaY || e.deltaX) / wheel.R * 0.6);
        clearTimeout(e.currentTarget._settle);
        e.currentTarget._settle = setTimeout(() => spinWheel(0), 120);
    }, { passive: false });

    /* ============================
       Undo & reset
       ============================ */
    function snapshot() {
        return {
            board: boardState.map(x => x && { ...x }),
            tray: trayState.map(x => ({ ...x })),
        };
    }

    function pushUndo() {
        undoStack.push(snapshot());
        if (undoStack.length > 300) undoStack.shift();
    }

    function restore(snap) {
        boardState = snap.board.map(x => x && { ...x });
        trayState = snap.tray.map(x => ({ ...x }));
        clearSelection();
    }

    function updateToolButtons() {
        document.getElementById('undoBtn').disabled = gameOver || undoStack.length === 0;
        document.getElementById('resetBtn').disabled = gameOver || undoStack.length === 0;
    }

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (isPaused || gameOver || !undoStack.length) return;
        cancelDrag();
        restore(undoStack.pop());
        steps++; // an undo is still a move, so it costs a little on stars
        Sound.back();
        render();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        if (isPaused || gameOver || !undoStack.length) return;
        cancelDrag();
        setPaused(true);
        showDialog('לאפס את הלוח?', 'כל האריחים שהנחת יחזרו לגלגל\nוהשעון יתחיל מחדש.', [
            { label: 'כן, לאפס', cls: 'btn-danger', action: () => {
                pushUndo(); // so an accidental reset can be undone
                restore(initialSnap);
                // A fresh clock — but the time already spent still counts toward
                // stars and the level, so a reset cannot buy an "easy" win.
                spentBeforeReset += totalTime - timeLeft;
                timeLeft = totalTime;
                updateTimerUI();
                wheelAngle = null;
                Sound.back();
                setPaused(false);
                render();
            } },
            { label: 'ביטול', cls: 'btn-secondary', action: () => setPaused(false) },
        ]);
    });

    /* ============================
       Moves (shared by tap and drag)
       ============================ */
    function placeFromTray(id, index) {
        const tIdx = trayState.findIndex(t => t.id === id);
        if (tIdx < 0 || boardState[index]?.locked) return false;
        pushUndo();
        const item = trayState.splice(tIdx, 1)[0];
        if (boardState[index]) trayState.push(boardState[index]); // occupant goes back
        boardState[index] = item;
        steps++;
        popIndex = index;
        Sound.drop();
        buzz(8);
        return true;
    }

    function moveOnBoard(from, to) {
        if (from === to) return false;
        if (boardState[to]?.locked || boardState[from]?.locked) return false;
        pushUndo();
        const hadOccupant = !!boardState[to];
        [boardState[from], boardState[to]] = [boardState[to], boardState[from]];
        steps++;
        popIndex = to;
        hadOccupant ? Sound.swap() : Sound.drop();
        buzz(8);
        return true;
    }

    function returnToTray(index) {
        const item = boardState[index];
        if (!item || item.locked) return false;
        pushUndo();
        boardState[index] = null;
        trayState.push(item);
        steps++;
        Sound.back();
        return true;
    }

    function rejectMove(el) {
        Sound.nope();
        buzz([20, 40, 20]);
        if (el) {
            el.classList.remove('shake');
            void el.offsetWidth;
            el.classList.add('shake');
        }
    }

    function clearSelection() {
        selectedSource = null;
        selectedId = null;
        selectedIndex = null;
    }

    function afterMove() {
        render();
    }

    /* ============================
       Tap interactions
       ============================ */
    function handleTrayClick(id) {
        if (isPaused || gameOver) return;
        if (selectedSource === 'tray' && selectedId === id) {
            clearSelection();
        } else {
            selectedSource = 'tray';
            selectedId = id;
            selectedIndex = null;
            Sound.select();
        }
        render(true);
    }

    function handleBoardClick(index, el) {
        if (isPaused || gameOver) return;
        const item = boardState[index];

        if (item?.locked) {
            if (selectedSource) rejectMove(el);
            return;
        }

        if (selectedSource === 'tray') {
            placeFromTray(selectedId, index);
            clearSelection();
        } else if (selectedSource === 'board') {
            if (selectedIndex === index) {
                // Second tap on the same tile sends it back to the tray
                returnToTray(index);
            } else {
                moveOnBoard(selectedIndex, index);
            }
            clearSelection();
        } else if (item) {
            // Select a placed tile: next tap moves/swaps it, or tap it again to return it
            selectedSource = 'board';
            selectedIndex = index;
            Sound.select();
            render(true);
            return;
        } else {
            return;
        }
        afterMove();
    }

    // Tapping the tray while a board tile is selected sends that tile back
    document.getElementById('trayContainer').addEventListener('click', () => {
        if (isPaused || gameOver || selectedSource !== 'board') return;
        returnToTray(selectedIndex);
        clearSelection();
        afterMove();
    });

    /* ============================
       Drag & drop (pointer events: mouse, touch and pen alike)
       ============================ */
    const DRAG_THRESHOLD = 6; // px before a press becomes a drag rather than a tap
    let drag = null;
    let suppressClickUntil = 0;

    document.addEventListener('pointerdown', (e) => {
        if (isPaused || gameOver || e.button > 0 || drag) return;
        const tile = e.target.closest('.tile[data-src]');
        const inWheel = !!e.target.closest('#trayContainer');
        if (!tile && !inWheel) return;
        if (inWheel) stopWheelMotion();
        drag = {
            src: tile ? tile.dataset.src : null,
            id: tile ? tile.dataset.id : null,
            index: tile && tile.dataset.index !== undefined ? +tile.dataset.index : null,
            el: tile,
            inWheel,
            mode: null, // decided on the first real movement: 'spin' or 'tile'
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            startAngle: wheelAngle,
            lastX: e.clientX,
            lastT: performance.now(),
            vel: 0,
            ghost: null,
            target: null,
        };
    });

    document.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
        if (!drag.mode) {
            if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
            if (drag.inWheel && (!drag.el || Math.abs(dx) > Math.abs(dy) || dy > 0)) {
                // sideways (or downward) on the wheel turns it
                drag.mode = 'spin';
            } else if (drag.el) {
                // upward from the wheel, or anything on the board, picks the tile up
                drag.mode = 'tile';
                startDragVisual();
            } else {
                drag = null;
                return;
            }
        }
        e.preventDefault();

        if (drag.mode === 'spin') {
            const now = performance.now();
            setWheelAngle(drag.startAngle - dx / wheel.R);
            const inst = -(e.clientX - drag.lastX) / wheel.R / Math.max(1, now - drag.lastT);
            drag.vel = 0.6 * inst + 0.4 * drag.vel;
            drag.lastX = e.clientX;
            drag.lastT = now;
            return;
        }

        drag.ghost.style.left = e.clientX + 'px';
        drag.ghost.style.top = e.clientY + 'px';
        updateDropTarget(e.clientX, e.clientY);
    }, { passive: false });

    document.addEventListener('pointerup', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        if (!drag.mode) { // a tap — the click handler takes it
            const wasWheel = drag.inWheel;
            drag = null;
            if (wasWheel) spinWheel(0); // settle if a tap interrupted a coast
            return;
        }
        suppressClickUntil = performance.now() + 300;
        if (drag.mode === 'spin') {
            // a finger that stopped before lifting does not fling
            const v = performance.now() - drag.lastT > 80 ? 0 : drag.vel;
            drag = null;
            spinWheel(v);
            return;
        }
        const target = drag.target;
        const d = drag;
        cancelDrag();
        performDrop(d, target);
    });

    // The browser or the system took the gesture
    document.addEventListener('pointercancel', (e) => {
        if (drag && e.pointerId === drag.pointerId) cancelDrag();
    });

    // A drag ends with a click on whatever was under the finger; swallow it.
    document.addEventListener('click', (e) => {
        if (performance.now() < suppressClickUntil && !e.target.closest('.modal-overlay, header')) {
            e.stopPropagation();
            e.preventDefault();
        }
    }, true);

    function startDragVisual() {
        const rect = drag.el.getBoundingClientRect();
        const size = Math.max(rect.width, 48);
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.style.width = size + 'px';
        ghost.style.height = size + 'px';
        const shape = drag.el.querySelector('.shape').cloneNode(true);
        ghost.appendChild(shape);
        document.body.appendChild(ghost);
        drag.ghost = ghost;
        drag.el.classList.add('drag-origin');
        clearSelection();
        document.querySelectorAll('.tile.selected').forEach(t => t.classList.remove('selected'));
        Sound.pick();
        buzz(5);
    }

    function clearDropHighlights() {
        document.querySelectorAll('.drop-ok, .drop-bad').forEach(el => el.classList.remove('drop-ok', 'drop-bad'));
    }

    function updateDropTarget(x, y) {
        clearDropHighlights();
        const el = document.elementFromPoint(x, y);
        const zone = el && el.closest('[data-drop]');
        drag.target = null;
        if (!zone) return;

        if (zone.dataset.drop === 'board') {
            const idx = +zone.dataset.index;
            const ok = !boardState[idx]?.locked && !(drag.src === 'board' && drag.index === idx);
            zone.classList.add(ok ? 'drop-ok' : 'drop-bad');
            drag.target = { kind: 'board', index: idx, ok };
        } else if (zone.dataset.drop === 'tray' && drag.src === 'board') {
            zone.classList.add('drop-ok');
            drag.target = { kind: 'tray', ok: true };
        }
    }

    function performDrop(d, target) {
        if (!target) { render(true); return; } // dropped nowhere: snap back
        if (!target.ok) { render(true); rejectMove(document.querySelector(`.slot[data-index="${target.index}"]`)); return; }

        let moved = false;
        if (target.kind === 'board') {
            moved = d.src === 'tray' ? placeFromTray(d.id, target.index) : moveOnBoard(d.index, target.index);
        } else if (target.kind === 'tray') {
            moved = returnToTray(d.index);
        }
        if (moved) afterMove(); else render(true);
    }

    function cancelDrag() {
        if (!drag) return;
        if (drag.ghost) drag.ghost.remove();
        if (drag.el) drag.el.classList.remove('drag-origin');
        if (drag.mode === 'spin') spinWheel(0);
        clearDropHighlights();
        drag = null;
    }

    /* ============================
       Validation
       ============================ */
    function lineOk(items) {
        if (items.some(x => !x)) return false;
        return new Set(items.map(x => x.color)).size === N && new Set(items.map(x => x.shape)).size === N;
    }

    // Board indices in a line that repeat a colour or a shape already in it.
    function lineClashes(indices) {
        const out = [];
        for (const key of ['color', 'shape']) {
            const seen = {};
            indices.forEach(i => { const x = boardState[i]; if (x) (seen[x[key]] ||= []).push(i); });
            Object.values(seen).forEach(list => { if (list.length > 1) out.push(...list); });
        }
        return out;
    }

    function validateState(silent = false) {
        let rowsV = true, colsV = true;
        const nowValid = new Set();
        const nowClash = new Set();
        const clashTiles = new Set();
        const pairs = new Set();
        let filled = 0;

        for (let i = 0; i < N; i++) {
            const rowIdx = [], colIdx = [];
            for (let k = 0; k < N; k++) {
                rowIdx.push(i * N + k);
                colIdx.push(k * N + i);
            }
            const rv = lineOk(rowIdx.map(j => boardState[j]));
            const cv = lineOk(colIdx.map(j => boardState[j]));
            // A repeat shows red at once, before the line is full
            const rc = lineClashes(rowIdx);
            const cc = lineClashes(colIdx);
            rc.forEach(j => clashTiles.add(j));
            cc.forEach(j => clashTiles.add(j));
            document.getElementById(`dot-row-${i}`).className = 'dot' + (rv ? ' valid' : rc.length ? ' clash' : '');
            document.getElementById(`dot-col-${i}`).className = 'dot' + (cv ? ' valid' : cc.length ? ' clash' : '');
            if (rv) nowValid.add('r' + i); else rowsV = false;
            if (cv) nowValid.add('c' + i); else colsV = false;
            if (rc.length) nowClash.add('r' + i);
            if (cc.length) nowClash.add('c' + i);
        }

        // Outline the clashing tiles — only where the guides are shown, like the dots
        document.querySelectorAll('.slot.clash').forEach(s => s.classList.remove('clash'));
        if (params.guides) {
            clashTiles.forEach(j => document.querySelector(`.slot[data-index="${j}"]`)?.classList.add('clash'));
        }
        // A soft bonk when a move creates a new clash
        if (!silent && params.guides && [...nowClash].some(k => !clashLines.has(k))) {
            setTimeout(() => Sound.clash(), 60);
        }
        clashLines = nowClash;
        boardState.forEach(x => { if (x) { filled++; pairs.add(x.color + x.shape); } });

        const uniqV = !params.unique || (filled === N * N && pairs.size === N * N);

        document.getElementById('chipRows').className = 'chip' + (rowsV ? ' valid' : '');
        document.getElementById('chipCols').className = 'chip' + (colsV ? ' valid' : '');
        document.getElementById('chipUnique').className = 'chip' + (params.unique && uniqV ? ' valid' : '');

        const won = rowsV && colsV && uniqV && trayState.length === 0;

        // A chime when a line newly completes — rising if lines come quickly.
        // Only where the guides are shown, or it would give away what the hidden dots hide.
        const fresh = [...nowValid].some(k => !validLines.has(k));
        if (!silent && !won && params.guides && fresh) {
            const now = performance.now();
            lineCombo = now - lastLineAt < 5000 ? lineCombo + 1 : 0;
            lastLineAt = now;
            const combo = lineCombo;
            setTimeout(() => Sound.line(combo), 90);
        }
        validLines = nowValid;

        if (won && !gameOver) endGame(true);
    }

    /* ============================
       End of a board
       ============================ */
    function confetti(count = 36) {
        const palette = ['var(--color-red)', 'var(--color-blue)', 'var(--color-green)', 'var(--color-yellow)', 'var(--color-purple)', 'var(--accent)'];
        for (let i = 0; i < count; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            const angle = Math.random() * Math.PI * 2;
            const dist = 120 + Math.random() * 180;
            c.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
            c.style.setProperty('--dy', Math.sin(angle) * dist + 120 + 'px');
            c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
            c.style.background = palette[i % palette.length];
            c.style.borderRadius = i % 3 === 0 ? '50%' : '3px';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 1300);
        }
    }

    /* ============================
       Score window: points count up into the level bar
       ============================ */
    const fmtPts = n => n.toLocaleString();

    function scoreHtml(r, startInfo) {
        const row = (id, label, pts) => `<div class="score-row" id="${id}"><span>${label}</span><b class="num" id="${id}Pts">${pts}</b></div>`;
        let html = '<div class="score">';
        if (r) {
            if (r.extendedSolve) {
                html += `<div class="score-note">⏳ נפתר עם זמן נוסף — 0 נקודות</div>`;
            } else {
                html += row('scTiles', `🧩 אריחים <bdi dir="ltr" class="num">${r.tiles} × ${POINTS_PER_TILE}</bdi>`, 0);
                html += row('scTime', `⏱ זמן שנותר <b class="num" id="scClock">${formatTime(r.secs)}</b>`, 0);
                if (r.goldPts) html += row('scGold', '✨ לוח זהב ×2', 0);
                if (r.dailyBonus) html += row('scDaily', '🎯 יעד יומי', 0);
            }
            html += `<div class="score-total"><span>סה״כ</span><b class="num"><bdi dir="ltr" id="scTotal">+0</bdi></b></div>`;
        } else {
            html += `<div class="score-note">0 נקודות</div>`;
        }
        html += `<div class="lvl-wrap">
            <div class="lvl-label"><span>רמה <b class="num" id="scLevel">${startInfo.L}</b></span>
                <bdi dir="ltr" class="num" id="scNums">${fmtPts(startInfo.into)} / ${fmtPts(startInfo.need)}</bdi></div>
            <div class="lvl-bar"><div class="lvl-fill" id="scFill" style="width:${startInfo.frac * 100}%"></div></div>
        </div></div>`;
        return html;
    }

    let scoreAnimId = 0;
    const sleep = ms => new Promise(res => setTimeout(res, ms));

    // Count the board's points into the bar: tiles one by one, then the clock
    // running down (3 points a second), then the bonuses. Crossing a level
    // fills the bar, plays the level-up show, and starts it again from empty.
    async function animateScore(startPoints, r) {
        const id = ++scoreAnimId;
        const alive = () => id === scoreAnimId;
        let pts = startPoints, shownL = levelInfo(pts).L, total = 0;
        const $ = k => document.getElementById(k);

        const bar = async () => {
            const li = levelInfo(pts);
            if (li.L > shownL) {
                $('scFill').style.width = '100%';
                await sleep(260);
                if (!alive()) return;
                await levelUpShow(li.L);
                if (!alive()) return;
                shownL = li.L;
                $('scLevel').innerText = li.L;
                const f = $('scFill');
                f.style.transition = 'none';
                f.style.width = '0%';
                void f.offsetWidth;
                f.style.transition = '';
            }
            $('scFill').style.width = (li.frac * 100) + '%';
            $('scNums').innerText = `${fmtPts(li.into)} / ${fmtPts(li.need)}`;
            $('scTotal').innerText = '+' + fmtPts(total);
        };
        const add = async (rowId, n) => {
            pts += n; total += n;
            const el = $(rowId + 'Pts');
            el.innerText = fmtPts(+el.innerText.replace(/\D/g, '') + n);
            await bar();
        };

        await sleep(450);
        if (!alive() || !r || r.extendedSolve) return;

        for (let i = 0; i < r.tiles; i++) {
            $('scTiles').classList.add('on');
            await add('scTiles', POINTS_PER_TILE);
            if (!alive()) return;
            Sound.pop(i, r.tiles);
            await sleep(Math.max(55, Math.min(150, 900 / r.tiles)));
            if (!alive()) return;
        }
        await sleep(200);

        // the clock runs down; about 1.5s whatever the time left
        $('scTime').classList.add('on');
        let secs = r.secs;
        const chunk = Math.max(1, Math.ceil(secs / 45));
        while (secs > 0) {
            const d = Math.min(chunk, secs);
            secs -= d;
            $('scClock').innerText = formatTime(secs);
            await add('scTime', d * POINTS_PER_SECOND);
            if (!alive()) return;
            Sound.click();
            await sleep(32);
            if (!alive()) return;
        }

        for (const [rowId, amount] of [['scGold', r.goldPts], ['scDaily', r.dailyBonus]]) {
            if (!amount) continue;
            await sleep(200);
            $(rowId).classList.add('on');
            for (let k = 0; k < 10; k++) {
                await add(rowId, amount / 10);
                if (!alive()) return;
                await sleep(40);
            }
            Sound.coin();
        }
        $('scTotal').closest('.score-total').classList.add('done');
    }

    // How long animateScore will run, so auto-continue waits for it
    function scoreAnimMs(r, levelsGained) {
        if (!r || r.extendedSolve) return 500;
        return 450 + r.tiles * Math.max(55, Math.min(150, 900 / r.tiles)) + 200
            + Math.ceil(r.secs / Math.max(1, Math.ceil(r.secs / 45))) * 32
            + (r.goldPts ? 600 : 0) + (r.dailyBonus ? 600 : 0)
            + levelsGained * 2100;
    }

    // Full-screen level-up: rays, the new number, confetti. Tap to skip.
    function levelUpShow(L) {
        return new Promise(resolve => {
            const prevN = levelParams(difficultyFor(L - 1)).N;
            const n = levelParams(difficultyFor(L)).N;
            const el = document.createElement('div');
            el.className = 'lvlup';
            el.innerHTML = `<div class="lvlup-rays"></div>
                <div class="lvlup-card">
                    <small>עלית רמה!</small>
                    <b class="num">${L}</b>
                    <span>${n > prevN ? `לוח ${n}×${n} נפתח 🎉` : rankFor(difficultyFor(L))}</span>
                </div>`;
            document.body.appendChild(el);
            Sound.levelUp();
            setTimeout(() => Sound.unlock(), 250);
            confetti(70);
            buzz([20, 40, 60]);
            const badge = document.getElementById('levelBadge');
            badge.classList.remove('up'); void badge.offsetWidth; badge.classList.add('up');
            document.getElementById('levelDisplay').innerText = L;

            let done = false;
            const finish = () => {
                if (done) return;
                done = true;
                el.classList.add('out');
                setTimeout(() => el.remove(), 350);
                resolve();
            };
            el.addEventListener('pointerdown', finish);
            setTimeout(finish, 1700);
        });
    }

    // won: solved the board. skipped: gave up from settings.
    function endGame(won, skipped = false) {
        if (gameOver) return;
        gameOver = true;
        cancelDrag();
        clearInterval(timerInterval);
        updateToolButtons();

        const stats = {
            timeFrac: Math.min(1, (spentBeforeReset + totalTime - timeLeft) / totalTime),
            efficiency: steps > 0 ? Math.min(1, minSteps / steps) : 1,
        };
        const perf = performance01(stats);
        const stars = won ? (extended ? 1 : starsFor(perf)) : 0;
        const startPoints = progress.points;
        const startInfo = levelInfo(startPoints);

        progress.played++;
        let reward = null;
        if (won) {
            reward = grantRewards(stars, stats, timeLeft, extended);
        } else {
            progress.winStreak = 0;
            progress.failStreak++;
        }
        const endInfo = levelInfo(progress.points);
        level = endInfo.L;

        // Did this result open a bigger board for the first time?
        const nextN = levelParams(difficultyFor(level)).N;
        const unlockedN = nextN > progress.maxN ? nextN : null;
        if (unlockedN) {
            progress.maxN = nextN;
            const extra = [];
            unlockAchievement('size' + nextN, extra);
            if (reward) reward.newAch.push(...extra);
        }
        saveProgress();

        const usedSec = spentBeforeReset + totalTime - timeLeft;
        const placed = N * N - boardState.filter(Boolean).length;
        const burstMs = won ? burstBoard() : 0;

        setTimeout(() => {
            if (won) {
                Sound.win();
                confetti(golden ? 60 : 36);
                buzz([30, 50, 30]);
            } else {
                Sound.lose();
            }

            let title, msg;
            if (unlockedN) {
                title = `לוח ${unlockedN}×${unlockedN} נפתח! 🎉`;
                msg = newInSize(unlockedN);
            } else if (won) {
                title = endInfo.L > startInfo.L ? 'עלית רמה! 🚀' : (stars === 3 ? 'מושלם! 🧩' : 'פתרת! 🧩');
                msg = `${steps} צעדים · ${usedSec} שניות`;
                if (extended) msg += `\nבפעם הבאה בלי זמן נוסף — ותקבל נקודות`;
                else if (stars < 3) msg += `\nעוד קצת יותר מהר — ושלושה כוכבים שלך`;
            } else if (skipped) {
                title = 'דילגת על הלוח';
                msg = 'הלוח הבא יהיה קצת יותר קל.';
            } else {
                title = 'הזמן נגמר! ⏰';
                // Near-miss framing: how close it was is the reason to go again
                msg = placed <= 2
                    ? `כמעט! חסרו רק ${placed === 1 ? 'אריח אחד' : 'שני אריחים'}.`
                    : 'לא הספקת הפעם. הלוח הבא יהיה קצת יותר קל.';
            }
            if (progress.winStreak >= 2 && won) msg += `\n🔥 ${progress.winStreak} ניצחונות ברצף`;

            const animMs = scoreAnimMs(reward, endInfo.L - startInfo.L);
            showDialog(title, msg, [
                { label: unlockedN ? `ללוח ה־${unlockedN}×${unlockedN}` : 'ללוח הבא', cls: 'btn-primary', action: initLevel,
                  autoMs: unlockedN ? 0 : (won ? 3000 : 4500), autoDelay: animMs },
            ], { stars, extraHtml: scoreHtml(reward, startInfo) });
            animateScore(startPoints, reward).then(() => updateHud());

            if (reward) {
                const xpStat = document.getElementById('xpStat');
                xpStat.classList.remove('bump'); void xpStat.offsetWidth; xpStat.classList.add('bump');
                reward.newAch.forEach((a, i) => setTimeout(() => { toast('🏅 ' + a.name, a.desc); Sound.coin(); }, animMs + 200 + i * 700));
                if (reward.dailyJustDone) setTimeout(() => toast('🎯 יעד יומי הושלם!', 'נתראה מחר — אל תשבור את הרצף 🔥'), animMs);
            }
        }, won ? burstMs + 150 : 0);
    }

    /* ============================
       Win: the tiles pop one by one, in random order, each with a little firework
       ============================ */
    function burstBoard() {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return 300;
        const tiles = shuffle([...document.querySelectorAll('#boardGrid .slot .tile')]);
        // the whole show takes about 1.3s whatever the board size
        const gap = Math.max(26, Math.min(110, 1300 / tiles.length));
        tiles.forEach((tile, k) => setTimeout(() => burstTile(tile, k, tiles.length), 250 + k * gap));
        return 250 + tiles.length * gap + 450;
    }

    function burstTile(tile, k, count) {
        const r = tile.getBoundingClientRect();
        const shape = tile.querySelector('.shape');
        const color = shape ? (shape.style.backgroundColor || shape.style.color) : 'var(--accent)';
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;

        tile.classList.add('burst');

        // a ring, then sparks flying out and falling a little
        const ring = document.createElement('div');
        ring.className = 'burst-ring';
        ring.style.left = cx + 'px';
        ring.style.top = cy + 'px';
        ring.style.width = ring.style.height = r.width + 'px';
        ring.style.borderColor = color;
        document.body.appendChild(ring);
        setTimeout(() => ring.remove(), 600);

        const sparks = 9;
        const reach = Math.max(26, r.width * 0.75);
        for (let i = 0; i < sparks; i++) {
            const a = (i / sparks) * Math.PI * 2 + Math.random() * 0.5;
            const d = reach * (0.7 + Math.random() * 0.6);
            const sp = document.createElement('div');
            sp.className = 'spark';
            sp.style.left = cx + 'px';
            sp.style.top = cy + 'px';
            sp.style.background = i % 3 === 0 ? 'var(--gold)' : color;
            sp.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
            sp.style.setProperty('--dy', (Math.sin(a) * d).toFixed(1) + 'px');
            document.body.appendChild(sp);
            setTimeout(() => sp.remove(), 750);
        }

        Sound.pop(k, count);
        if (k % 4 === 0) buzz(4);
    }

    // Startup
    applyStyleUI();
    applyThemeUI();
    applySoundUI();
    initLevel();
    if (liveDayStreak() > 0 && todayWins() === 0) {
        setTimeout(() => toast(`🔥 רצף של ${liveDayStreak()} ימים`, 'נצח לוח אחד היום כדי לשמור עליו'), 600);
    }
</script>
</body>
</html>
