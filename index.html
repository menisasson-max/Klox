<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1120">
    <title>Klox</title>
    <script>
        // Apply the saved theme before first paint, so light mode never flashes dark.
        // The animals style is always light.
        (function () {
            let t = null, st = null;
            try { t = localStorage.getItem('klox_theme'); st = localStorage.getItem('klox_style'); } catch (e) {}
            if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            if (st === 'animals') t = 'light';
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <style>
        /* ============================
           Variables & Theming
           ============================ */
        :root {
            /* Dark Theme Colors (default) */
            --bg-base: #0b1120;
            --bg-surface: #1e293b;
            --bg-slot: #0f172a;
            --bg-locked: rgba(255, 255, 255, 0.03);
            --border-color: #334155;
            --border-highlight: #64748b;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            /* Tile colours, introduced in this order as the board grows */
            --color-red: #f43f5e;
            --color-blue: #38bdf8;
            --color-green: #10b981;
            --color-yellow: #facc15;
            --color-purple: #a78bfa;
            --color-orange: #fb923c;
            --color-white: #e2e8f0;

            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gold: #fbbf24;

            --shadow: rgba(0, 0, 0, 0.35);
            --overlay: rgba(0, 0, 0, 0.7);
        }

        :root[data-theme="light"] {
            --bg-base: #eef2f7;
            --bg-surface: #ffffff;
            --bg-slot: #e2e8f0;
            --bg-locked: rgba(15, 23, 42, 0.06);
            --border-color: #cbd5e1;
            --border-highlight: #94a3b8;

            --text-main: #0f172a;
            --text-muted: #64748b;

            --color-red: #e11d48;
            --color-blue: #0284c7;
            --color-green: #059669;
            --color-yellow: #ca8a04;
            --color-purple: #7c3aed;
            --color-orange: #ea580c;
            --color-white: #475569;

            --accent: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --gold: #d97706;

            --shadow: rgba(15, 23, 42, 0.15);
            --overlay: rgba(15, 23, 42, 0.45);
        }

        /* ============================
           Global Reset & Layout
           ============================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* The page never scrolls: the board takes whatever height is left. */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            height: 100%;
            padding: 10px 12px;
            gap: 10px;
            min-height: 0;
        }

        /* ============================
           Header & Status
           ============================ */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px 10px;
            flex-shrink: 0;
            box-shadow: 0 4px 6px -1px var(--shadow);
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .icon-btn {
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: var(--border-highlight);
        }

        .level-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            padding: 3px 10px;
            border-radius: 12px;
            position: relative;
            min-width: 70px;
        }

        .level-badge span { font-size: 0.65rem; color: var(--text-muted); }
        .level-badge strong { font-size: 1.15rem; color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
        .level-badge.up { animation: badgeUp 0.9s ease; }
        .level-badge.down { animation: badgeDown 0.9s ease; }

        @keyframes badgeUp {
            0% { transform: scale(1); }
            30% { transform: scale(1.18); box-shadow: 0 0 18px var(--success); border-color: var(--success); }
            100% { transform: scale(1); }
        }
        @keyframes badgeDown {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); border-color: var(--danger); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(2px); }
        }

        .level-delta {
            position: absolute;
            top: -10px;
            inset-inline-start: 50%;
            transform: translateX(50%);
            font-size: 0.8rem;
            font-weight: 800;
            pointer-events: none;
            animation: floatUp 1.4s ease forwards;
        }
        .level-delta.pos { color: var(--success); }
        .level-delta.neg { color: var(--danger); }
        @keyframes floatUp {
            0% { opacity: 0; translate: 0 6px; }
            20% { opacity: 1; }
            100% { opacity: 0; translate: 0 -22px; }
        }

        .app-title {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .app-title strong { font-size: 1.15rem; }
        .app-title span { font-size: 0.72rem; color: var(--text-muted); }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
            flex-shrink: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            gap: 8px;
        }

        .status-bar .stat { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .status-bar .stat b { color: var(--text-main); font-variant-numeric: tabular-nums; }
        .status-bar .stat.streak b { color: var(--warning); }
        .status-bar .stat.bump { animation: pop 0.4s ease; }

        .timer {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            color: var(--text-main);
            font-size: 1.05rem;
        }
        .timer.danger { color: var(--danger); animation: pulse 1s infinite; }
        .timer.extended::after { content: ' ⏳'; font-size: 0.8em; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ============================
           Goal strip: the next milestone, always one board away
           ============================ */
        .goal-strip {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 6px;
        }
        .goal-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .goal-text b { color: var(--text-main); }
        .goal-text .done { color: var(--success); font-weight: 700; }
        .bar {
            height: 6px;
            border-radius: 3px;
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--success));
            transition: width 0.8s cubic-bezier(.2,.8,.3,1);
        }

        /* ============================
           Chips (Rules)
           ============================ */
        .chips {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .chip {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            transition: 0.3s ease;
            white-space: nowrap;
        }

        .chip::before {
            content: '';
            display: block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--border-color);
            transition: 0.3s ease;
        }

        .chip.valid { color: var(--text-main); border-color: var(--success); }
        .chip.valid::before { background: var(--success); box-shadow: 0 0 8px var(--success); }

        /* ============================
           Board Layout
           ============================ */
        .board-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* on tall screens the board sits down by the thumb, over its tools */
            width: 100%;
            min-height: 0; /* Important for flex child to shrink properly */
            position: relative;
            container-type: size; /* lets the board size itself to the smaller side */
        }

        .board-container {
            --gap: 10px; --pad: 16px; --radius: 14px; --s: 45%; --dot-track: 22px; --lock: 14px; --tile-border: 3px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: var(--pad);
            width: min(100cqw, 100cqh, 460px);
            aspect-ratio: 1 / 1;
            box-shadow: 0 10px 30px var(--shadow);
            transition: filter 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Bigger boards: tighter gaps, bigger shapes in smaller tiles */
        .board-container.size-4 { --gap: 8px; --pad: 13px; --radius: 12px; --s: 50%; --dot-track: 18px; --lock: 12px; }
        .board-container.size-5 { --gap: 6px; --pad: 11px; --radius: 10px; --s: 56%; --dot-track: 16px; --lock: 10px; --tile-border: 2px; }
        .board-container.size-6 { --gap: 5px; --pad: 9px; --radius: 9px; --s: 60%; --dot-track: 14px; --lock: 9px; --tile-border: 2px; }
        .board-container.size-7 { --gap: 4px; --pad: 8px; --radius: 8px; --s: 62%; --dot-track: 12px; --lock: 8px; --tile-border: 2px; }

        .board-container.golden {
            border: 2px solid var(--gold);
            box-shadow: 0 0 24px color-mix(in srgb, var(--gold) 45%, transparent), 0 10px 30px var(--shadow);
        }

        .board-container.paused {
            filter: grayscale(100%) blur(8px);
            pointer-events: none;
        }

        /* N columns of slots plus a narrow track for the row dots (on the left in RTL) */
        .board-grid {
            display: grid;
            gap: var(--gap);
            width: 100%;
            height: 100%;
        }

        .board-grid.no-guides .dot { visibility: hidden; }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--border-color);
            justify-self: center;
            align-self: center;
            transition: 0.3s ease;
        }
        .dot.clash {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
            transform: scale(1.25);
        }
        .slot.clash {
            border: 2px solid var(--danger);
            background: color-mix(in srgb, var(--danger) 10%, var(--bg-slot));
        }
        .dot.valid {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            transform: scale(1.25);
        }

        /* ============================
           Slots & Tiles
           ============================ */
        .slot {
            width: 100%;
            height: 100%;
            background: var(--bg-slot);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            position: relative; /* Anchor for absolute children */
            overflow: hidden; /* Prevent ANY visual escape */
            transition: border-color 0.15s ease, background-color 0.15s ease;
            min-width: 0;
            min-height: 0;
        }

        .slot.locked {
            background: var(--bg-locked);
        }

        .slot.drop-ok {
            border: 2px dashed var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, var(--bg-slot));
        }
        .slot.drop-bad {
            border: 2px dashed var(--danger);
        }

        .tile {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            border-radius: var(--radius, 14px);
            border: var(--tile-border, 3px) solid transparent;
            transition: transform 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
            box-sizing: border-box;
            touch-action: none; /* on the board a finger drags the tile, never scrolls */
        }

        .tile.locked-tile { cursor: default; }
        .tile:not(.locked-tile):active { transform: scale(0.95); }

        .tile.selected {
            border-color: var(--text-main);
            transform: scale(0.92);
            box-shadow: 0 4px 15px var(--shadow);
            z-index: 10;
        }

        .tile.drag-origin { opacity: 0.25; }
        .tile.pop { animation: pop 0.28s ease; }
        .tile.shake { animation: shake 0.35s ease; }
        .slot.shake { animation: shake 0.35s ease; }

        @keyframes pop {
            0% { transform: scale(0.6); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }

        .drag-ghost {
            --s: 50%;
            position: fixed;
            z-index: 200;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            background: var(--bg-surface);
            border: 2px solid var(--accent);
            box-shadow: 0 12px 28px var(--shadow);
            transform: translate(-50%, -50%) scale(1.12) rotate(-4deg);
        }

        .lock-svg {
            position: absolute;
            top: 12%;
            right: 12%;
            width: var(--lock);
            height: var(--lock);
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        /* ============================
           Shapes (Pure CSS)
           ============================ */
        .shape {
            width: var(--s, 45%);
            height: var(--s, 45%);
        }

        .shape.square { border-radius: 18%; }

        /* Animals are drawn edge to edge in their box, so they get more of the tile */
        .shape.animal {
            width: min(90%, calc(var(--s, 45%) + 32%));
            height: min(90%, calc(var(--s, 45%) + 32%));
            overflow: visible;
        }
        .shape.circle { border-radius: 50%; }

        /* Pointed shapes read smaller than their box, so they get a little more of it */
        .shape.triangle {
            width: calc(var(--s, 45%) + 8%);
            height: calc(var(--s, 45%) + 8%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .shape.diamond {
            width: calc(var(--s, 45%) + 10%);
            height: calc(var(--s, 45%) + 10%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }
        .shape.hexagon {
            width: calc(var(--s, 45%) + 6%);
            height: calc(var(--s, 45%) + 6%);
            clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%);
        }
        .shape.cross {
            width: calc(var(--s, 45%) + 6%);
            height: calc(var(--s, 45%) + 6%);
            clip-path: polygon(33% 0%, 67% 0%, 67% 33%, 100% 33%, 100% 67%, 67% 67%, 67% 100%, 33% 100%, 33% 67%, 0% 67%, 0% 33%, 33% 33%);
        }
        .shape.star {
            width: calc(var(--s, 45%) + 14%);
            height: calc(var(--s, 45%) + 14%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        /* ============================
           Board tools: undo and reset, small, under the board
           ============================ */
        .board-tools {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-shrink: 0;
            margin-top: -2px;
        }
        .tool-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }
        .tool-btn:active:not(:disabled) { transform: scale(0.88); }
        .tool-btn:disabled { opacity: 0.35; cursor: default; }
        /* "back" points the way you read: rightward in Hebrew */
        [dir="rtl"] .tool-btn .flip-rtl { transform: scaleX(-1); }

        /* ============================
           Tray — a wheel at the bottom of the screen. Only its top arc shows;
           tiles further round sink out of sight. Spin it sideways, pull a
           tile up to place it.
           ============================ */
        .tray-container {
            position: relative;
            flex-shrink: 0;
            height: 132px;
            margin: 0 -12px -10px; /* run to the screen edges and the bottom */
            overflow: hidden;
            touch-action: none; /* every gesture here is ours: spin or pick up */
        }

        .wheel-disc {
            position: absolute;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 -6px 22px var(--shadow);
            transition: border-color 0.15s ease;
        }
        /* faint spokes so the disc reads as something that turns */
        .wheel-disc::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: repeating-conic-gradient(from var(--spin, 0rad), transparent 0 9deg, color-mix(in srgb, var(--border-color) 35%, transparent) 9deg 10deg);
            -webkit-mask-image: radial-gradient(circle, transparent 0 calc(100% - 46px), #000 calc(100% - 45px));
            mask-image: radial-gradient(circle, transparent 0 calc(100% - 46px), #000 calc(100% - 45px));
        }
        .tray-container.drop-ok .wheel-disc { border: 2px dashed var(--accent); }

        .tray-header {
            position: absolute;
            top: 4px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 2;
        }

        .tray-count {
            background: var(--bg-slot);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .tray-slots { position: absolute; inset: 0; }

        .tray-slot {
            position: absolute;
            left: 0;
            top: 0;
            width: 52px;
            height: 52px;
            margin: -26px 0 0 -26px; /* positioned by its centre */
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            will-change: transform;
        }

        .tray-slot .tile { --radius: 14px; --s: 50%; }

        /* Short screens: every pixel goes to the board */
        @media (max-height: 760px) {
            .app-container { gap: 7px; padding-top: 8px; }
            header { padding: 6px 10px; }
            .icon-btn { width: 34px; height: 34px; }
            .tray-container { height: 112px; }
            .board-tools { margin: -3px 0 -4px; gap: 22px; }
            .tool-btn { width: 30px; height: 30px; }
            .tool-btn svg { width: 15px; height: 15px; }
        }

        .tray-empty {
            position: absolute;
            left: 0;
            right: 0;
            top: 64px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ============================
           Modals
           ============================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 24px;
            width: 88%;
            max-width: 350px;
            max-height: 90dvh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 20px 40px var(--shadow);
            animation: pop 0.25s ease;
        }

        .modal-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 10px; }
        .modal-msg { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 14px; white-space: pre-line; }

        .stars { font-size: 1.8rem; letter-spacing: 6px; margin-bottom: 6px; }
        .stars span { display: inline-block; opacity: 0.2; filter: grayscale(1); }
        .stars span.on { opacity: 1; filter: none; animation: starIn 0.45s cubic-bezier(.3,1.6,.5,1) backwards; }
        @keyframes starIn { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }

        .reward {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .reward b { color: var(--gold); font-size: 1.1rem; }

        .score {
            text-align: start;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 10px;
            background: var(--bg-slot);
            font-size: 0.9rem;
            color: var(--text-muted);
            opacity: 0.55;
            transition: opacity 0.2s ease;
        }
        .score-row.on { opacity: 1; color: var(--text-main); }
        .score-row b { font-size: 1rem; }
        .score-note { text-align: center; color: var(--text-muted); font-size: 0.9rem; }
        .score-total {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 2px 10px;
            font-weight: 800;
        }
        .score-total b { font-size: 1.35rem; color: var(--gold); }
        .score-total.done b { animation: pop 0.35s ease; }
        .lvl-wrap { margin-top: 4px; }
        .lvl-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .lvl-label b { color: var(--accent); font-size: 1.05rem; }
        .lvl-bar {
            height: 12px;
            border-radius: 6px;
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .lvl-fill {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--accent), var(--success), var(--gold));
            background-size: 200% 100%;
            animation: barShine 1.6s linear infinite;
            transition: width 0.12s linear;
        }
        @keyframes barShine { from { background-position: 0 0; } to { background-position: 200% 0; } }
        .num { font-variant-numeric: tabular-nums; }

        /* Level-up show */
        .lvlup {
            position: fixed;
            inset: 0;
            z-index: 260;
            display: flex;
            align-items: center;
            justify-content: center;
            /* dark in both themes, so the white number always stands out */
            background: radial-gradient(circle, rgba(30, 64, 175, 0.96) 0%, rgba(8, 12, 24, 0.97) 65%);
            animation: lvlIn 0.25s ease;
            overflow: hidden;
        }
        .lvlup.out { animation: lvlOut 0.35s ease forwards; }
        @keyframes lvlIn { from { opacity: 0; } }
        @keyframes lvlOut { to { opacity: 0; transform: scale(1.08); } }
        .lvlup-rays {
            position: absolute;
            width: 180vmax;
            height: 180vmax;
            background: repeating-conic-gradient(rgba(251, 191, 36, 0.35) 0 8deg, transparent 8deg 22deg);
            -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 55%);
            mask-image: radial-gradient(circle, #000 0%, transparent 55%);
            animation: raysSpin 6s linear infinite;
        }
        @keyframes raysSpin { to { transform: rotate(360deg); } }
        .lvlup-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
            animation: cardIn 0.6s cubic-bezier(.2,1.6,.4,1);
        }
        .lvlup-card small { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; }
        .lvlup-card b {
            font-size: 6.5rem;
            line-height: 1;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 20%, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 18px rgba(251, 191, 36, 0.7));
        }
        .lvlup-card span { font-size: 1rem; font-weight: 700; margin-top: 4px; }
        @keyframes cardIn {
            0% { transform: scale(0.2) rotate(-12deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .ach-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 16px;
            text-align: start;
        }
        .ach {
            font-size: 0.75rem;
            padding: 6px 8px;
            border-radius: 10px;
            background: var(--bg-slot);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .ach.on { color: var(--text-main); border-color: var(--gold); }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: 0.2s ease;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); }
        .btn-secondary { background: var(--bg-slot); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

        /* The "next board" button fills up and presses itself */
        .btn.auto::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.22);
            transform-origin: right;
            animation: autoFill var(--auto-ms, 3000ms) linear forwards;
        }
        @keyframes autoFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

        /* ============================
           Toasts & Confetti
           ============================ */
        .toasts {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
            width: max-content;
            max-width: 92vw;
        }
        .toast {
            background: var(--bg-surface);
            border: 1px solid var(--gold);
            color: var(--text-main);
            border-radius: 14px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 8px 24px var(--shadow);
            animation: toastIn 2.8s ease forwards;
        }
        .toast small { display: block; font-weight: 500; color: var(--text-muted); font-size: 0.75rem; }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateY(-16px) scale(0.9); }
            10%, 85% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .tile.burst { animation: tileBurst 0.42s cubic-bezier(.3,1.4,.6,1) forwards; }
        @keyframes tileBurst {
            0% { transform: scale(1); opacity: 1; }
            35% { transform: scale(1.22); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        .burst-ring {
            position: fixed;
            border: 3px solid;
            border-radius: 50%;
            pointer-events: none;
            z-index: 150;
            transform: translate(-50%, -50%) scale(0.3);
            animation: ringOut 0.55s ease-out forwards;
        }
        @keyframes ringOut {
            to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; border-width: 1px; }
        }
        .spark {
            position: fixed;
            width: 5px;
            height: 5px;
            margin: -2.5px 0 0 -2.5px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 151;
            box-shadow: 0 0 6px currentColor;
            animation: sparkOut 0.7s cubic-bezier(.15,.7,.4,1) forwards;
        }
        @keyframes sparkOut {
            0% { transform: translate(0, 0) scale(1.2); opacity: 1; }
            70% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), calc(var(--dy) + 14px)) scale(0.3); opacity: 0; }
        }

        .confetti {
            position: fixed;
            top: 40%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 150;
            animation: confetti 1.2s cubic-bezier(.2,.7,.4,1) forwards;
        }
        @keyframes confetti {
            0% { transform: translate(0, 0) rotate(0); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition: none !important; }
        }
    </style>
</head>

<script>
    /* ============================
       Storage (never throws: private windows can refuse it)
       ============================ */
    const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    };

    /* ============================
       Sound — tiny synthesised bleeps, no audio files
       ============================ */
    const Sound = {
        ctx: null,
        enabled: store.get('klox_sound') !== 'off',

        ensure() {
            if (!this.enabled) return null;
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                this.ctx = new AC();
            }
            if (this.ctx.state === 'suspended') this.ctx.resume();
            return this.ctx;
        },

        tone(freq, { type = 'sine', dur = 0.12, vol = 0.16, delay = 0, slideTo = null } = {}) {
            const ctx = this.ensure();
            if (!ctx) return;
            const t0 = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
            // Fast attack, soft exponential tail: reads as a "plink", not a beep.
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.02);
        },

        pick()  { this.tone(620, { dur: 0.09, slideTo: 940, vol: 0.13 }); },
        drop()  { this.tone(880, { type: 'triangle', dur: 0.11, slideTo: 520 }); this.tone(1320, { dur: 0.06, vol: 0.05, delay: 0.03 }); },
        swap()  { this.tone(700, { type: 'triangle', dur: 0.07 }); this.tone(940, { type: 'triangle', dur: 0.08, delay: 0.07 }); },
        back()  { this.tone(740, { dur: 0.1, slideTo: 420, vol: 0.12 }); },
        select(){ this.tone(1040, { dur: 0.05, vol: 0.08 }); },
        nope()  { this.tone(220, { type: 'square', dur: 0.09, vol: 0.05 }); this.tone(185, { type: 'square', dur: 0.12, vol: 0.05, delay: 0.09 }); },
        clash() { this.tone(330, { type: 'triangle', dur: 0.14, slideTo: 247, vol: 0.09 }); },
        pop(k = 0, count = 9) {
            const f = 440 * Math.pow(2, (k / Math.max(1, count - 1)) * 14 / 12) * (0.97 + Math.random() * 0.06);
            this.tone(f, { dur: 0.07, slideTo: f * 1.6, vol: 0.07 });
            this.tone(f * 3, { dur: 0.05, vol: 0.025, delay: 0.03 });
        },
        click() { this.tone(2400, { type: 'triangle', dur: 0.025, vol: 0.035 }); },
        tick()  { this.tone(1500, { dur: 0.03, vol: 0.04 }); },
        // Each line completed in quick succession chimes a step higher
        line(combo = 0) {
            const k = Math.pow(2, Math.min(combo, 8) * 2 / 12);
            [784, 988, 1175].forEach((f, i) => this.tone(f * k, { dur: 0.16, vol: 0.1, delay: i * 0.06 }));
        },
        win()   {
            [523, 659, 784, 1047].forEach((f, i) => this.tone(f, { type: 'triangle', dur: 0.22, vol: 0.14, delay: i * 0.09 }));
            [1568, 2093, 2637].forEach((f, i) => this.tone(f, { dur: 0.12, vol: 0.05, delay: 0.42 + i * 0.07 }));
        },
        star(i) { this.tone(1046 * Math.pow(2, i * 4 / 12), { dur: 0.18, vol: 0.09 }); },
        coin()  { this.tone(988, { type: 'square', dur: 0.06, vol: 0.04 }); this.tone(1319, { type: 'square', dur: 0.16, vol: 0.04, delay: 0.06 }); },
        unlock(){ [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => this.tone(f, { type: 'triangle', dur: 0.2, vol: 0.12, delay: i * 0.07 })); },
        lose()  { [523, 440, 349].forEach((f, i) => this.tone(f, { type: 'triangle', dur: 0.25, vol: 0.12, delay: i * 0.14 })); },
        levelUp()   { this.tone(440, { dur: 0.35, slideTo: 1320, vol: 0.1 }); this.tone(1760, { dur: 0.15, vol: 0.05, delay: 0.3 }); },
        levelDown() { this.tone(520, { type: 'triangle', dur: 0.4, slideTo: 260, vol: 0.1 }); },
    };

    function buzz(pattern) {
        if (Sound.enabled && navigator.vibrate) navigator.vibrate(pattern);
    }

    const ANIMAL_FOR = { square: 'bear', circle: 'cat', triangle: 'rabbit', diamond: 'sheep', hexagon: 'deer', star: 'pig', cross: 'owl' };
    const ANIMAL_NAME = { bear: 'דוב', cat: 'חתול', rabbit: 'ארנב', sheep: 'כבשה', deer: 'אייל', pig: 'חזיר', owl: 'ינשוף' };
    const SHAPE_NAME = { square: 'ריבוע', circle: 'עיגול', triangle: 'משולש', diamond: 'מעוין', hexagon: 'משושה', star: 'כוכב', cross: 'פלוס' };

    /* ============================
       Toasts
       ============================ */
    function toast(title, sub = '') {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerText = title;
        if (sub) {
            const s = document.createElement('small');
            s.innerText = sub;
            el.appendChild(s);
        }
        document.getElementById('toasts').appendChild(el);
        setTimeout(() => el.remove(), 2900);
    }

    /* ============================
       Board sizes

       The board grows with the level: 3×3 up to 7×7. Each size adds one
       colour and one shape. 3, 4, 5 and 7 keep all three rules. 6×6 drops
       "every pair unique": no two orthogonal 6×6 Latin squares exist (Euler's
       36 officers), so no 6×6 board can satisfy it.
       ============================ */
    const ALL_COLORS = ['var(--color-red)', 'var(--color-blue)', 'var(--color-green)', 'var(--color-yellow)', 'var(--color-purple)', 'var(--color-orange)', 'var(--color-white)'];
    const ALL_SHAPES = ['square', 'circle', 'triangle', 'diamond', 'hexagon', 'star', 'cross'];
    const NEW_COLOR_NAME = { 4: 'צהוב', 5: 'סגול', 6: 'כתום', 7: 'אפור' };
    function newInSize(n) {
        const sh = ALL_SHAPES[n - 1];
        let text = `צבע חדש: ${NEW_COLOR_NAME[n]} · `
            + (style === 'animals' ? `חיה חדשה: ${ANIMAL_NAME[ANIMAL_FOR[sh]]}` : `צורה חדשה: ${SHAPE_NAME[sh]}`);
        if (n === 6) text += '\nבלוח 6×6 זוגות יכולים לחזור — רק שורות ועמודות צריכות להיות שונות.';
        if (n === 7) text += '\nהלוח הגדול ביותר — וכל זוג שוב חייב להיות ייחודי.';
        return text;
    }

    // Each size owns a stretch of the level scale; within it, t runs 0 → 1.
    const SIZE_BANDS = [
        { N: 3, from: 1.0 },
        { N: 4, from: 3.0 },
        { N: 5, from: 5.5 },
        { N: 6, from: 8.0 },
        { N: 7, from: 10.5 },
    ];
    const MIN_LEVEL = 1.0;
    const MAX_LEVEL = 13.0;

    // What fraction of the board you place yourself, from the start of a size to its end
    const MISSING_FRAC = { 3: [0.34, 0.95], 4: [0.35, 0.8], 5: [0.3, 0.64], 6: [0.25, 0.56], 7: [0.22, 0.46] };

    function levelParams(L) {
        let bi = 0;
        SIZE_BANDS.forEach((b, i) => { if (L >= b.from) bi = i; });
        const band = SIZE_BANDS[bi];
        const end = SIZE_BANDS[bi + 1] ? SIZE_BANDS[bi + 1].from : MAX_LEVEL;
        const t = Math.max(0, Math.min(1, (L - band.from) / (end - band.from)));
        const N = band.N;
        const cells = N * N;
        const [f0, f1] = MISSING_FRAC[N];
        const missing = Math.max(3, Math.min(cells, Math.round(cells * (f0 + (f1 - f0) * t))));
        return {
            N, t,
            nextAt: SIZE_BANDS[bi + 1] ? SIZE_BANDS[bi + 1].from : null,
            missing,
            // Past the middle of a size, some tiles start on the board in the wrong place
            scrambled: t >= 0.4 ? Math.min(missing - 1, Math.floor((t - 0.3) * N)) : 0,
            // Seconds per tile shrink as you climb within a size
            time: Math.round(25 + missing * (22 - 10 * t)),
            // Late in each size (from 4×4 on) the per-line dots go away
            guides: N === 3 || t < 0.75,
            unique: N !== 6,
        };
    }

    function rankFor(L) {
        if (L >= 12) return 'אגדה';
        if (L >= 10.5) return 'מאסטר';
        if (L >= 8) return 'מחונן';
        if (L >= 6) return 'מומחה';
        if (L >= 4.5) return 'חד';
        if (L >= 3) return 'מתקדם';
        return 'חושב מתחיל';
    }

    /* ============================
       Progress: points and levels

       Every solved board earns points: 50 for each tile you placed and 3 for
       each second left on the clock (doubled on a golden board). Points only
       add up, and the level is read off the total. Each level costs more than
       the one before, so the early ones come almost every board and later
       ones take several good boards. A fast solve leaves more seconds and so
       climbs faster — "too easy, jump ahead" falls out of the scoring.

       The level sets the board on the 1–13 difficulty scale above, a quarter
       step per level: 3×3 for levels 1–8, 4×4 from 9, 5×5 from 19, 6×6 from
       29, 7×7 from 39. Levels go on past 49; the board stops getting harder.

       A loss earns nothing and never takes points away. After losses in a
       row the boards ease a little — inside the current board size, without
       touching the level — so nobody is stuck on a wall for good. A win
       clears it.
       ============================ */
    const DAILY_GOAL = 5;
    const DAILY_BONUS = 250;
    const POINTS_PER_TILE = 50;
    const POINTS_PER_SECOND = 3;
    const DIFF_PER_LEVEL = 0.25;

    // Points from level L to L+1: 1,000 at level 1, ~2,150 at 10, ~4,000 at 20, ~9,450 at 40
    function pointsToNext(L) {
        const k = L - 1;
        return Math.round((1000 + 100 * k + 3 * k * k) / 50) * 50;
    }

    function pointsForLevel(L) {
        let sum = 0;
        for (let i = 1; i < L; i++) sum += pointsToNext(i);
        return sum;
    }

    // { L, into: points into this level, need: points this level takes, frac }
    function levelInfo(points) {
        let L = 1, floor = 0;
        while (points >= floor + pointsToNext(L)) { floor += pointsToNext(L); L++; }
        const need = pointsToNext(L);
        return { L, into: points - floor, need, frac: (points - floor) / need };
    }

    function difficultyFor(L) {
        return Math.min(MAX_LEVEL, MIN_LEVEL + (L - 1) * DIFF_PER_LEVEL);
    }

    // The board actually dealt: the level's difficulty, eased after losses in a row
    function boardDifficulty() {
        const d = difficultyFor(level);
        if (!progress.failStreak) return d;
        const sizeStart = SIZE_BANDS.filter(b => b.from <= d).pop().from;
        return Math.max(sizeStart, d - Math.min(1, 0.25 * progress.failStreak));
    }

    function freshProgress() {
        return {
            points: 0, failStreak: 0, played: 0,
            winStreak: 0, bestWinStreak: 0, maxN: 3,
            dayStreak: 0, lastWinDay: null, today: { date: null, wins: 0 },
            achievements: [],
        };
    }

    // Points started everyone over from zero, under a new key; the old
    // klox_level / klox_progress are left alone and never read.
    const PROGRESS_KEY = 'klox_progress_v2';
    let progress = (() => {
        const base = freshProgress();
        try {
            const saved = JSON.parse(store.get(PROGRESS_KEY));
            if (saved && typeof saved === 'object') Object.assign(base, saved);
        } catch (e) {}
        return base;
    })();
    let level = levelInfo(progress.points).L;

    function saveProgress() {
        store.set(PROGRESS_KEY, JSON.stringify(progress));
    }

    function dayKey(d = new Date()) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function yesterdayKey() {
        const d = new Date();
        d.setDate(d.getDate() - 1);
        return dayKey(d);
    }
    function todayWins() {
        return progress.today.date === dayKey() ? progress.today.wins : 0;
    }
    // A streak that skipped yesterday is already broken, even before today's first win
    function liveDayStreak() {
        return (progress.lastWinDay === dayKey() || progress.lastWinDay === yesterdayKey()) ? progress.dayStreak : 0;
    }

    function performance01(stats) {
        // mostly speed, some move efficiency — this now only sets the stars
        return 0.6 * (1 - stats.timeFrac) + 0.4 * stats.efficiency;
    }

    /* ============================
       Rewards: stars, XP, streaks, daily goal, achievements
       ============================ */
    const ACHIEVEMENTS = [
        { id: 'first',   name: 'ניצחון ראשון',       desc: 'פתרת לוח' },
        { id: 'perfect', name: 'מושלם',              desc: 'שלושה כוכבים' },
        { id: 'size4',   name: 'לוח 4×4',            desc: 'הגעת ל־4×4' },
        { id: 'size5',   name: 'לוח 5×5',            desc: 'הגעת ל־5×5' },
        { id: 'size6',   name: 'לוח 6×6',            desc: 'הגעת ל־6×6' },
        { id: 'size7',   name: 'לוח 7×7',            desc: 'הגעת ל־7×7' },
        { id: 'streak5', name: 'רצף 5',              desc: '5 ניצחונות ברצף' },
        { id: 'streak10',name: 'בלתי ניתן לעצירה',   desc: '10 ניצחונות ברצף' },
        { id: 'speed',   name: 'ברק',                desc: 'סיימת ברבע מהזמן' },
        { id: 'golden',  name: 'נגיעת זהב',          desc: 'פתרת לוח זהב' },
        { id: 'daily',   name: 'יעד יומי',           desc: `${DAILY_GOAL} לוחות ביום` },
        { id: 'days3',   name: '3 ימים ברצף',        desc: 'שיחקת 3 ימים רצופים' },
        { id: 'days7',   name: 'שבוע שלם',           desc: '7 ימים רצופים' },
        { id: 'xp1000',  name: '10,000 נקודות',      desc: 'צברת 10,000 ⭐' },
        { id: 'peak8',   name: 'פסגה',               desc: 'הגעת לרמה 30' },
    ];

    function unlockAchievement(id, out) {
        if (progress.achievements.includes(id)) return;
        progress.achievements.push(id);
        out.push(ACHIEVEMENTS.find(a => a.id === id));
    }

    function starsFor(perf) {
        return perf >= 0.72 ? 3 : perf >= 0.45 ? 2 : 1;
    }

    // Called once per won board. Adds the board's points and returns the breakdown.
    function grantRewards(stars, stats, secondsLeft, extendedSolve) {
        const newAch = [];
        progress.failStreak = 0;
        progress.winStreak++;
        progress.bestWinStreak = Math.max(progress.bestWinStreak, progress.winStreak);

        // Day streak and today's count
        const today = dayKey();
        if (progress.lastWinDay !== today) {
            progress.dayStreak = progress.lastWinDay === yesterdayKey() ? progress.dayStreak + 1 : 1;
            progress.lastWinDay = today;
        }
        if (progress.today.date !== today) progress.today = { date: today, wins: 0 };
        progress.today.wins++;
        const dailyJustDone = progress.today.wins === DAILY_GOAL;

        // Points: 50 per tile placed + 3 per second left; golden doubles both.
        // Solving on bought time earns none — that is what "no level gain" means now.
        const tiles = params.missing;
        const secs = extendedSolve ? 0 : Math.max(0, secondsLeft);
        const tilePts = extendedSolve ? 0 : tiles * POINTS_PER_TILE;
        const timePts = secs * POINTS_PER_SECOND;
        const goldPts = golden && !extendedSolve ? tilePts + timePts : 0;
        const dailyBonus = dailyJustDone && !extendedSolve ? DAILY_BONUS : 0;
        const total = tilePts + timePts + goldPts + dailyBonus;
        progress.points += total;

        unlockAchievement('first', newAch);
        if (stars === 3) unlockAchievement('perfect', newAch);
        if (progress.winStreak >= 5) unlockAchievement('streak5', newAch);
        if (progress.winStreak >= 10) unlockAchievement('streak10', newAch);
        if (stats.timeFrac <= 0.25 && !extendedSolve) unlockAchievement('speed', newAch);
        if (golden) unlockAchievement('golden', newAch);
        if (dailyJustDone) unlockAchievement('daily', newAch);
        if (progress.dayStreak >= 3) unlockAchievement('days3', newAch);
        if (progress.dayStreak >= 7) unlockAchievement('days7', newAch);
        if (progress.points >= 10000) unlockAchievement('xp1000', newAch);
        if (levelInfo(progress.points).L >= 30) unlockAchievement('peak8', newAch);

        return { tiles, tilePts, secs, timePts, goldPts, dailyBonus, total, dailyJustDone, newAch, extendedSolve };
    }

    /* ============================
       State
       ============================ */
    let params = levelParams(boardDifficulty());
    let N = params.N;
    let colors = ALL_COLORS.slice(0, N);
    let shapes = ALL_SHAPES.slice(0, N);

    let boardState = [];   // null or {color, shape, locked, id}
    let trayState = [];    // [{color, shape, id}]
    let minSteps = 0;
    let golden = false;

    let selectedSource = null; // 'board' | 'tray' | null
    let selectedId = null;     // tray tile id
    let selectedIndex = null;  // board index
    let steps = 0;
    let gameOver = false;
    let validLines = new Set();
    let clashLines = new Set();
    let popIndex = null;       // board index to animate on next render
    let lineCombo = 0;
    let lastLineAt = 0;
    let autoTimer = null;
    let undoStack = [];        // snapshots before each move
    let initialSnap = null;    // the board as dealt, for "reset board"
    let spentBeforeReset = 0;  // seconds used before the board was reset; still counts for stars
    let extended = false;      // the player bought extra time: solving still counts, but earns no points

    /* ============================
       Timer
       ============================ */
    let totalTime = params.time;
    let timeLeft = totalTime;
    let timerInterval = null;
    let isPaused = false;

    function formatTime(s) {
        const m = Math.floor(s / 60).toString().padStart(2, '0');
        const sc = (s % 60).toString().padStart(2, '0');
        return `${m}:${sc}`;
    }

    function updateTimerUI() {
        const el = document.getElementById('timerDisplay');
        el.innerText = formatTime(timeLeft);
        el.classList.toggle('danger', timeLeft <= Math.min(30, Math.floor(totalTime / 4)));
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (isPaused || gameOver) return;
            timeLeft--;
            updateTimerUI();
            if (timeLeft > 0 && timeLeft <= 10) Sound.tick();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                // extra time is offered once per board
                if (extended) endGame(false); else offerExtraTime();
            }
        }, 1000);
    }

    const EXTRA_SECONDS = 30;

    // Out of time: offer 30 more seconds, once per board. Solving after that still
    // counts as a solve (streaks, daily goal) but earns no points.
    function offerExtraTime() {
        cancelDrag();
        setPaused(true);
        Sound.lose();
        const left = trayState.length;
        showDialog('הזמן נגמר! ⏰', `להוסיף עוד ${EXTRA_SECONDS} שניות? (פעם אחת בלוח)\nאם תפתור עכשיו — הלוח ייחשב, אבל בלי נקודות.`
            + (left ? `\nנשארו ${left} אריחים במגש.` : ''), [
            { label: `⏳ עוד ${EXTRA_SECONDS} שניות`, cls: 'btn-primary', action: () => {
                extended = true;
                // the whole original clock is spent; keep "seconds used" honest across the extension
                spentBeforeReset += EXTRA_SECONDS;
                timeLeft = EXTRA_SECONDS;
                updateTimerUI();
                document.getElementById('timerDisplay').classList.add('extended');
                setPaused(false);
                Sound.coin();
            } },
            { label: 'לא, סיים את הלוח', cls: 'btn-secondary', action: () => {
                endGame(false);   // sets gameOver first, so un-pausing below does not restart the clock
                setPaused(false);
            } },
        ]);
    }

    function setPaused(p) {
        isPaused = p;
        document.getElementById('boardContainer').classList.toggle('paused', p);
        document.getElementById('icon-pause').style.display = p ? 'none' : 'block';
        document.getElementById('icon-play').style.display = p ? 'block' : 'none';
        if (p) clearInterval(timerInterval);
        else if (!gameOver) startTimer();
    }

    document.getElementById('pauseBtn').addEventListener('click', () => {
        if (gameOver) return;
        cancelDrag();
        setPaused(!isPaused);
        Sound.select();
    });

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) return;
        if (!isPaused && !gameOver) { cancelDrag(); setPaused(true); }
        // Never start the next board behind the player's back
        if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; document.querySelectorAll('.btn.auto').forEach(b => b.classList.remove('auto')); }
    });

    /* ============================
       Modal
       ============================ */
    // buttons: [{ label, cls, action, autoMs }]
    function showDialog(title, msg, buttons, { stars = 0, extraHtml = '' } = {}) {
        document.getElementById('dialogTitle').innerText = title;
        document.getElementById('dialogMessage').innerText = msg;
        document.getElementById('dialogExtra').innerHTML = extraHtml;

        const st = document.getElementById('dialogStars');
        st.style.display = stars ? 'block' : 'none';
        st.innerHTML = '';
        for (let i = 0; i < 3 && stars; i++) {
            const s = document.createElement('span');
            s.innerText = '⭐';
            if (i < stars) {
                s.className = 'on';
                s.style.animationDelay = (0.25 + i * 0.22) + 's';
                setTimeout(() => Sound.star(i), 250 + i * 220);
            }
            st.appendChild(s);
        }

        const modal = document.getElementById('dialogModal');
        const box = document.getElementById('dialogButtons');
        box.innerHTML = '';
        if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
        buttons.forEach(b => {
            const el = document.createElement('button');
            el.className = 'btn ' + (b.cls || 'btn-primary');
            el.innerText = b.label;
            el.onclick = () => {
                if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
                modal.style.display = 'none';
                Sound.select();
                if (b.action) b.action();
            };
            if (b.autoMs) {
                const begin = () => {
                    el.classList.add('auto');
                    el.style.setProperty('--auto-ms', b.autoMs + 'ms');
                    autoTimer = setTimeout(() => { autoTimer = null; el.onclick(); }, b.autoMs);

                if (b.autoDelay) autoTimer = setTimeout(begin, b.autoDelay); else begin();
            }
            box.appendChild(el);
        });
        modal.style.display = 'flex';
    }

    /* ============================
       Puzzle generation
       ============================ */
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Multiplication in GF(4) = {0, 1, x, x+1} with x² = x + 1; addition is XOR.
    const GF4_MUL = [[0, 0, 0, 0], [0, 1, 2, 3], [0, 2, 3, 1], [0, 3, 1, 2]];

    // Two N×N Latin squares (colour index, shape index). For N = 3, 4, 5, 7 they are
    // orthogonal, so every colour+shape pair appears exactly once.
    function baseSquares(n) {
        const a = [], b = [];
        for (let r = 0; r < n; r++) {
            for (let c = 0; c < n; c++) {
                if (n === 4) {
                    a.push(r ^ c);
                    b.push(GF4_MUL[2][r] ^ c);
                } else if (n === 6) {
                    // No orthogonal pair exists; two independent Latin squares
                    a.push((r + c) % 6);
                    b.push((c - r + 6) % 6);
                } else {
                    a.push((r + c) % n);
                    b.push((r + 2 * c) % n);
                }
            }
        }
        return [a, b];
    }

    // Permuting rows, columns and symbols (and transposing) keeps every rule,
    // so each board gets a fresh solution instead of the same one every time.
    function generateValidBoard(n) {
        let [a, b] = baseSquares(n);
        if (n === 6) {
            // make the second square less predictable: shuffle its rows, which keeps it Latin
            const rp = shuffle([...Array(6).keys()]);
            b = b.map((_, i) => b[rp[Math.floor(i / 6)] * 6 + (i % 6)]);
        }
        const rows = shuffle([...Array(n).keys()]);
        const cols = shuffle([...Array(n).keys()]);
        const colorMap = shuffle([...colors]);
        const shapeMap = shuffle([...shapes]);
        const transpose = Math.random() < 0.5;
        const flip = Math.random() < 0.5;

        const solution = [];
        for (let r = 0; r < n; r++) {
            for (let c = 0; c < n; c++) {
                let rr = rows[r], cc = cols[c];
                if (transpose) [rr, cc] = [cc, rr];
                const i = rr * n + cc;
                solution.push({
                    color: colorMap[flip ? b[i] : a[i]],
                    shape: shapeMap[flip ? a[i] : b[i]],
                });
            }
        }
        return solution;
    }

        document.getElementById('goalLabel').innerHTML =
