<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1120">
    <title>Klox</title>
    <script>
        // Apply the saved theme before first paint, so light mode never flashes dark.
        (function () {
            let t = null;
            try { t = localStorage.getItem('klox_theme'); } catch (e) {}
            if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <style>
        /* ============================
           Variables & Theming
           ============================ */
        :root {
            /* Dark Theme Colors (default) */
            --bg-base: #0b1120;
            --bg-surface: #1e293b;
            --bg-slot: #0f172a;
            --bg-locked: rgba(255, 255, 255, 0.03);
            --border-color: #334155;
            --border-highlight: #64748b;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            /* Tile colours, introduced in this order as the board grows */
            --color-red: #f43f5e;
            --color-blue: #38bdf8;
            --color-green: #10b981;
            --color-yellow: #facc15;
            --color-purple: #a78bfa;
            --color-orange: #fb923c;
            --color-white: #e2e8f0;

            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gold: #fbbf24;

            --shadow: rgba(0, 0, 0, 0.35);
            --overlay: rgba(0, 0, 0, 0.7);
        }

        :root[data-theme="light"] {
            --bg-base: #eef2f7;
            --bg-surface: #ffffff;
            --bg-slot: #e2e8f0;
            --bg-locked: rgba(15, 23, 42, 0.06);
            --border-color: #cbd5e1;
            --border-highlight: #94a3b8;

            --text-main: #0f172a;
            --text-muted: #64748b;

            --color-red: #e11d48;
            --color-blue: #0284c7;
            --color-green: #059669;
            --color-yellow: #ca8a04;
            --color-purple: #7c3aed;
            --color-orange: #ea580c;
            --color-white: #475569;

            --accent: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --gold: #d97706;

            --shadow: rgba(15, 23, 42, 0.15);
            --overlay: rgba(15, 23, 42, 0.45);
        }

        /* ============================
           Global Reset & Layout
           ============================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* The page never scrolls: the board takes whatever height is left. */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            height: 100%;
            padding: 10px 12px;
            gap: 10px;
            min-height: 0;
        }

        /* ============================
           Header & Status
           ============================ */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px 10px;
            flex-shrink: 0;
            box-shadow: 0 4px 6px -1px var(--shadow);
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .icon-btn {
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: var(--border-highlight);
        }

        .level-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            padding: 3px 10px;
            border-radius: 12px;
            position: relative;
            min-width: 70px;
        }

        .level-badge span { font-size: 0.65rem; color: var(--text-muted); }
        .level-badge strong { font-size: 1.15rem; color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
        .level-badge.up { animation: badgeUp 0.9s ease; }
        .level-badge.down { animation: badgeDown 0.9s ease; }

        @keyframes badgeUp {
            0% { transform: scale(1); }
            30% { transform: scale(1.18); box-shadow: 0 0 18px var(--success); border-color: var(--success); }
            100% { transform: scale(1); }
        }
        @keyframes badgeDown {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); border-color: var(--danger); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(2px); }
        }

        .level-delta {
            position: absolute;
            top: -10px;
            inset-inline-start: 50%;
            transform: translateX(50%);
            font-size: 0.8rem;
            font-weight: 800;
            pointer-events: none;
            animation: floatUp 1.4s ease forwards;
        }
        .level-delta.pos { color: var(--success); }
        .level-delta.neg { color: var(--danger); }
        @keyframes floatUp {
            0% { opacity: 0; translate: 0 6px; }
            20% { opacity: 1; }
            100% { opacity: 0; translate: 0 -22px; }
        }

        .app-title {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .app-title strong { font-size: 1.15rem; }
        .app-title span { font-size: 0.72rem; color: var(--text-muted); }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
            flex-shrink: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            gap: 8px;
        }

        .status-bar .stat { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .status-bar .stat b { color: var(--text-main); font-variant-numeric: tabular-nums; }
        .status-bar .stat.streak b { color: var(--warning); }
        .status-bar .stat.bump { animation: pop 0.4s ease; }

        .timer {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            color: var(--text-main);
            font-size: 1.05rem;
        }
        .timer.danger { color: var(--danger); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ============================
           Goal strip: the next milestone, always one board away
           ============================ */
        .goal-strip {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 6px;
        }
        .goal-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .goal-text b { color: var(--text-main); }
        .goal-text .done { color: var(--success); font-weight: 700; }
        .bar {
            height: 6px;
            border-radius: 3px;
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--success));
            transition: width 0.8s cubic-bezier(.2,.8,.3,1);
        }

        /* ============================
           Chips (Rules)
           ============================ */
        .chips {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .chip {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            transition: 0.3s ease;
            white-space: nowrap;
        }

        .chip::before {
            content: '';
            display: block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--border-color);
            transition: 0.3s ease;
        }

        .chip.valid { color: var(--text-main); border-color: var(--success); }
        .chip.valid::before { background: var(--success); box-shadow: 0 0 8px var(--success); }

        /* ============================
           Board Layout
           ============================ */
        .board-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* on tall screens the board sits down by the thumb, over its tools */
            width: 100%;
            min-height: 0; /* Important for flex child to shrink properly */
            position: relative;
            container-type: size; /* lets the board size itself to the smaller side */
        }

        .board-container {
            --gap: 10px; --pad: 16px; --radius: 14px; --s: 45%; --dot-track: 22px; --lock: 14px; --tile-border: 3px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: var(--pad);
            width: min(100cqw, 100cqh, 460px);
            aspect-ratio: 1 / 1;
            box-shadow: 0 10px 30px var(--shadow);
            transition: filter 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Bigger boards: tighter gaps, bigger shapes in smaller tiles */
        .board-container.size-4 { --gap: 8px; --pad: 13px; --radius: 12px; --s: 50%; --dot-track: 18px; --lock: 12px; }
        .board-container.size-5 { --gap: 6px; --pad: 11px; --radius: 10px; --s: 56%; --dot-track: 16px; --lock: 10px; --tile-border: 2px; }
        .board-container.size-6 { --gap: 5px; --pad: 9px; --radius: 9px; --s: 60%; --dot-track: 14px; --lock: 9px; --tile-border: 2px; }
        .board-container.size-7 { --gap: 4px; --pad: 8px; --radius: 8px; --s: 62%; --dot-track: 12px; --lock: 8px; --tile-border: 2px; }

        .board-container.golden {
            border: 2px solid var(--gold);
            box-shadow: 0 0 24px color-mix(in srgb, var(--gold) 45%, transparent), 0 10px 30px var(--shadow);
        }

        .board-container.paused {
            filter: grayscale(100%) blur(8px);
            pointer-events: none;
        }

        /* N columns of slots plus a narrow track for the row dots (on the left in RTL) */
        .board-grid {
            display: grid;
            gap: var(--gap);
            width: 100%;
            height: 100%;
        }

        .board-grid.no-guides .dot { visibility: hidden; }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--border-color);
            justify-self: center;
            align-self: center;
            transition: 0.3s ease;
        }
        .dot.clash {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
            transform: scale(1.25);
        }
        .slot.clash {
            border: 2px solid var(--danger);
            background: color-mix(in srgb, var(--danger) 10%, var(--bg-slot));
        }
        .dot.valid {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            transform: scale(1.25);
        }

        /* ============================
           Slots & Tiles
           ============================ */
        .slot {
            width: 100%;
            height: 100%;
            background: var(--bg-slot);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            position: relative; /* Anchor for absolute children */
            overflow: hidden; /* Prevent ANY visual escape */
            transition: border-color 0.15s ease, background-color 0.15s ease;
            min-width: 0;
            min-height: 0;
        }

        .slot.locked {
            background: var(--bg-locked);
        }

        .slot.drop-ok {
            border: 2px dashed var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, var(--bg-slot));
        }
        .slot.drop-bad {
            border: 2px dashed var(--danger);
        }

        .tile {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            border-radius: var(--radius, 14px);
            border: var(--tile-border, 3px) solid transparent;
            transition: transform 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
            box-sizing: border-box;
            touch-action: none; /* on the board a finger drags the tile, never scrolls */
        }

        .tile.locked-tile { cursor: default; }
        .tile:not(.locked-tile):active { transform: scale(0.95); }

        .tile.selected {
            border-color: var(--text-main);
            transform: scale(0.92);
            box-shadow: 0 4px 15px var(--shadow);
            z-index: 10;
        }

        .tile.drag-origin { opacity: 0.25; }
        .tile.pop { animation: pop 0.28s ease; }
        .tile.shake { animation: shake 0.35s ease; }
        .slot.shake { animation: shake 0.35s ease; }

        @keyframes pop {
            0% { transform: scale(0.6); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }

        .drag-ghost {
            --s: 50%;
            position: fixed;
            z-index: 200;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            background: var(--bg-surface);
            border: 2px solid var(--accent);
            box-shadow: 0 12px 28px var(--shadow);
            transform: translate(-50%, -50%) scale(1.12) rotate(-4deg);
        }

        .lock-svg {
            position: absolute;
            top: 12%;
            right: 12%;
            width: var(--lock);
            height: var(--lock);
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        /* ============================
           Shapes (Pure CSS)
           ============================ */
        .shape {
            width: var(--s, 45%);
            height: var(--s, 45%);
        }

        .shape.square { border-radius: 18%; }
        .shape.circle { border-radius: 50%; }

        /* Pointed shapes read smaller than their box, so they get a little more of it */
        .shape.triangle {
            width: calc(var(--s, 45%) + 8%);
            height: calc(var(--s, 45%) + 8%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .shape.diamond {
            width: calc(var(--s, 45%) + 10%);
            height: calc(var(--s, 45%) + 10%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }
        .shape.hexagon {
            width: calc(var(--s, 45%) + 6%);
            height: calc(var(--s, 45%) + 6%);
            clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%);
        }
        .shape.cross {
            width: calc(var(--s, 45%) + 6%);
            height: calc(var(--s, 45%) + 6%);
            clip-path: polygon(33% 0%, 67% 0%, 67% 33%, 100% 33%, 100% 67%, 67% 67%, 67% 100%, 33% 100%, 33% 67%, 0% 67%, 0% 33%, 33% 33%);
        }
        .shape.star {
            width: calc(var(--s, 45%) + 14%);
            height: calc(var(--s, 45%) + 14%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        /* ============================
           Board tools: undo and reset, small, under the board
           ============================ */
        .board-tools {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-shrink: 0;
            margin-top: -2px;
        }
        .tool-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }
        .tool-btn:active:not(:disabled) { transform: scale(0.88); }
        .tool-btn:disabled { opacity: 0.35; cursor: default; }
        /* "back" points the way you read: rightward in Hebrew */
        [dir="rtl"] .tool-btn .flip-rtl { transform: scaleX(-1); }

        /* ============================
           Tray — a wheel at the bottom of the screen. Only its top arc shows;
           tiles further round sink out of sight. Spin it sideways, pull a
           tile up to place it.
           ============================ */
        .tray-container {
            position: relative;
            flex-shrink: 0;
            height: 132px;
            margin: 0 -12px -10px; /* run to the screen edges and the bottom */
            overflow: hidden;
            touch-action: none; /* every gesture here is ours: spin or pick up */
        }

        .wheel-disc {
            position: absolute;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 -6px 22px var(--shadow);
            transition: border-color 0.15s ease;
        }
        /* faint spokes so the disc reads as something that turns */
        .wheel-disc::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: repeating-conic-gradient(from var(--spin, 0rad), transparent 0 9deg, color-mix(in srgb, var(--border-color) 35%, transparent) 9deg 10deg);
            -webkit-mask-image: radial-gradient(circle, transparent 0 calc(100% - 46px), #000 calc(100% - 45px));
            mask-image: radial-gradient(circle, transparent 0 calc(100% - 46px), #000 calc(100% - 45px));
        }
        .tray-container.drop-ok .wheel-disc { border: 2px dashed var(--accent); }

        .tray-header {
            position: absolute;
            top: 4px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 2;
        }

        .tray-count {
            background: var(--bg-slot);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .tray-slots { position: absolute; inset: 0; }

        .tray-slot {
            position: absolute;
            left: 0;
            top: 0;
            width: 52px;
            height: 52px;
            margin: -26px 0 0 -26px; /* positioned by its centre */
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            will-change: transform;
        }

        .tray-slot .tile { --radius: 14px; --s: 50%; }

        /* Short screens: every pixel goes to the board */
        @media (max-height: 760px) {
            .app-container { gap: 7px; padding-top: 8px; }
            header { padding: 6px 10px; }
            .icon-btn { width: 34px; height: 34px; }
            .tray-container { height: 112px; }
            .board-tools { margin: -3px 0 -4px; gap: 22px; }
            .tool-btn { width: 30px; height: 30px; }
            .tool-btn svg { width: 15px; height: 15px; }
        }

        .tray-empty {
            position: absolute;
            left: 0;
            right: 0;
            top: 64px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ============================
           Modals
           ============================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 24px;
            width: 88%;
            max-width: 350px;
            max-height: 90dvh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 20px 40px var(--shadow);
            animation: pop 0.25s ease;
        }

        .modal-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 10px; }
        .modal-msg { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 14px; white-space: pre-line; }

        .stars { font-size: 2rem; letter-spacing: 6px; margin-bottom: 8px; }
        .stars span { display: inline-block; opacity: 0.2; filter: grayscale(1); }
        .stars span.on { opacity: 1; filter: none; animation: starIn 0.45s cubic-bezier(.3,1.6,.5,1) backwards; }
        @keyframes starIn { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }

        .reward {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .reward b { color: var(--gold); font-size: 1.1rem; }

        .level-change {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .level-change .nums { white-space: nowrap; font-size: 1.25rem; }
        .level-change .tag {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--bg-slot);
            color: var(--text-muted);
        }
        .level-change .tag.fast { color: var(--warning); }
        .level-change .tag.ceiling { color: var(--accent); }
        .level-change .tag.drop { color: var(--danger); }

        .ach-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 16px;
            text-align: start;
        }
        .ach {
            font-size: 0.75rem;
            padding: 6px 8px;
            border-radius: 10px;
            background: var(--bg-slot);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .ach.on { color: var(--text-main); border-color: var(--gold); }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: 0.2s ease;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); }
        .btn-secondary { background: var(--bg-slot); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

        /* The "next board" button fills up and presses itself */
        .btn.auto::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.22);
            transform-origin: right;
            animation: autoFill var(--auto-ms, 3000ms) linear forwards;
        }
        @keyframes autoFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

        /* ============================
           Toasts & Confetti
           ============================ */
        .toasts {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
            width: max-content;
            max-width: 92vw;
        }
        .toast {
            background: var(--bg-surface);
            border: 1px solid var(--gold);
            color: var(--text-main);
            border-radius: 14px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 8px 24px var(--shadow);
            animation: toastIn 2.8s ease forwards;
        }
        .toast small { display: block; font-weight: 500; color: var(--text-muted); font-size: 0.75rem; }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateY(-16px) scale(0.9); }
            10%, 85% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .confetti {
            position: fixed;
            top: 40%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 150;
            animation: confetti 1.2s cubic-bezier(.2,.7,.4,1) forwards;
        }
        @keyframes confetti {
            0% { transform: translate(0, 0) rotate(0); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition: none !important; }
        }
    </style>
</head>

<script>
    /* ============================
       Storage (never throws: private windows can refuse it)
       ============================ */
    const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    };

    /* ============================
       Sound — tiny synthesised bleeps, no audio files
       ============================ */
    const Sound = {
        ctx: null,
        enabled: store.get('klox_sound') !== 'off',

        ensure() {
            if (!this.enabled) return null;
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                this.ctx = new AC();
            }
            if (this.ctx.state === 'suspended') this.ctx.resume();
            return this.ctx;
        },

        tone(freq, { type = 'sine', dur = 0.12, vol = 0.16, delay = 0, slideTo = null } = {}) {
            const ctx = this.ensure();
            if (!ctx) return;
            const t0 = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
            // Fast attack, soft exponential tail: reads as a "plink", not a beep.
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.02);
        },

        pick()  { this.tone(620, { dur: 0.09, slideTo: 940, vol: 0.13 }); },
        drop()  { this.tone(880, { type: 'triangle', dur: 0.11, slideTo: 520 }); this.tone(1320, { dur: 0.06, vol: 0.05, delay: 0.03 }); },
        swap()  { this.tone(700, { type: 'triangle', dur: 0.07 }); this.tone(940, { type: 'triangle', dur: 0.08, delay: 0.07 }); },
        back()  { this.tone(740, { dur: 0.1, slideTo: 420, vol: 0.12 }); },
        select(){ this.tone(1040, { dur: 0.05, vol: 0.08 }); },
        nope()  { this.tone(220, { type: 'square', dur: 0.09, vol: 0.05 }); this.tone(185, { type: 'square', dur: 0.12, vol: 0.05, delay: 0.09 }); },
        clash() { this.tone(330, { type: 'triangle', dur: 0.14, slideTo: 247, vol: 0.09 }); },
        click() { this.tone(2400, { type: 'triangle', dur: 0.025, vol: 0.035 }); },
        tick()  { this.tone(1500, { dur: 0.03, vol: 0.04 }); },
        // Each line completed in quick succession chimes a step higher
        line(combo = 0) {
            const k = Math.pow(2, Math.min(combo, 8) * 2 / 12);
            [784, 988, 1175].forEach((f, i) => this.tone(f * k, { dur: 0.16, vol: 0.1, delay: i * 0.06 }));
        },
        win()   {
            [523, 659, 784, 1047].forEach((f, i) => this.tone(f, { type: 'triangle', dur: 0.22, vol: 0.14, delay: i * 0.09 }));
            [1568, 2093, 2637].forEach((f, i) => this.tone(f, { dur: 0.12, vol: 0.05, delay: 0.42 + i * 0.07 }));
        },
        star(i) { this.tone(1046 * Math.pow(2, i * 4 / 12), { dur: 0.18, vol: 0.09 }); },
        coin()  { this.tone(988, { type: 'square', dur: 0.06, vol: 0.04 }); this.tone(1319, { type: 'square', dur: 0.16, vol: 0.04, delay: 0.06 }); },
        unlock(){ [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => this.tone(f, { type: 'triangle', dur: 0.2, vol: 0.12, delay: i * 0.07 })); },
        lose()  { [523, 440, 349].forEach((f, i) => this.tone(f, { type: 'triangle', dur: 0.25, vol: 0.12, delay: i * 0.14 })); },
        levelUp()   { this.tone(440, { dur: 0.35, slideTo: 1320, vol: 0.1 }); this.tone(1760, { dur: 0.15, vol: 0.05, delay: 0.3 }); },
        levelDown() { this.tone(520, { type: 'triangle', dur: 0.4, slideTo: 260, vol: 0.1 }); },
    };

    function buzz(pattern) {
        if (Sound.enabled && navigator.vibrate) navigator.vibrate(pattern);
    }

    /* ============================
       Theme & sound toggles
       ============================ */
    function applyThemeUI() {
        const light = document.documentElement.dataset.theme === 'light';
        document.getElementById('icon-sun').style.display = light ? 'none' : 'block';
        document.getElementById('icon-moon').style.display = light ? 'block' : 'none';
        document.querySelector('meta[name="theme-color"]').content = light ? '#eef2f7' : '#0b1120';
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        document.documentElement.dataset.theme = next;
        store.set('klox_theme', next);
        applyThemeUI();
        Sound.select();
    });

    function applySoundUI() {
        document.getElementById('icon-sound-on').style.display = Sound.enabled ? 'block' : 'none';
        document.getElementById('icon-sound-off').style.display = Sound.enabled ? 'none' : 'block';
    }

    document.getElementById('soundBtn').addEventListener('click', () => {
        Sound.enabled = !Sound.enabled;
        store.set('klox_sound', Sound.enabled ? 'on' : 'off');
        applySoundUI();
        Sound.select();
    });

    /* ============================
       Toasts
       ============================ */
    function toast(title, sub = '') {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerText = title;
        if (sub) {
            const s = document.createElement('small');
            s.innerText = sub;
            el.appendChild(s);
        }
        document.getElementById('toasts').appendChild(el);
        setTimeout(() => el.remove(), 2900);
    }

    /* ============================
       Board sizes

       The board grows with the level: 3×3 up to 7×7. Each size adds one
       colour and one shape. 3, 4, 5 and 7 keep all three rules. 6×6 drops
       "every pair unique": no two orthogonal 6×6 Latin squares exist (Euler's
       36 officers), so no 6×6 board can satisfy it.
       ============================ */
    const ALL_COLORS = ['var(--color-red)', 'var(--color-blue)', 'var(--color-green)', 'var(--color-yellow)', 'var(--color-purple)', 'var(--color-orange)', 'var(--color-white)'];
    const ALL_SHAPES = ['square', 'circle', 'triangle', 'diamond', 'hexagon', 'star', 'cross'];
    const NEW_IN_SIZE = {
        4: 'צבע חדש: צהוב · צורה חדשה: מעוין',
        5: 'צבע חדש: סגול · צורה חדשה: משושה',
        6: 'צבע חדש: כתום · צורה חדשה: כוכב\nבלוח 6×6 זוגות יכולים לחזור — רק שורות ועמודות צריכות להיות שונות.',
        7: 'צבע חדש: אפור · צורה חדשה: פלוס\nהלוח הגדול ביותר — וכל זוג שוב חייב להיות ייחודי.',
    };

    // Each size owns a stretch of the level scale; within it, t runs 0 → 1.
    const SIZE_BANDS = [
        { N: 3, from: 1.0 },
        { N: 4, from: 3.0 },
        { N: 5, from: 5.5 },
        { N: 6, from: 8.0 },
        { N: 7, from: 10.5 },
    ];
    const MIN_LEVEL = 1.0;
    const MAX_LEVEL = 13.0;

    // What fraction of the board you place yourself, from the start of a size to its end
    const MISSING_FRAC = { 3: [0.34, 0.95], 4: [0.35, 0.8], 5: [0.3, 0.64], 6: [0.25, 0.56], 7: [0.22, 0.46] };

    function levelParams(L) {
        let bi = 0;
        SIZE_BANDS.forEach((b, i) => { if (L >= b.from) bi = i; });
        const band = SIZE_BANDS[bi];
        const end = SIZE_BANDS[bi + 1] ? SIZE_BANDS[bi + 1].from : MAX_LEVEL;
        const t = Math.max(0, Math.min(1, (L - band.from) / (end - band.from)));
        const N = band.N;
        const cells = N * N;
        const [f0, f1] = MISSING_FRAC[N];
        const missing = Math.max(3, Math.min(cells, Math.round(cells * (f0 + (f1 - f0) * t))));
        return {
            N, t,
            nextAt: SIZE_BANDS[bi + 1] ? SIZE_BANDS[bi + 1].from : null,
            missing,
            // Past the middle of a size, some tiles start on the board in the wrong place
            scrambled: t >= 0.4 ? Math.min(missing - 1, Math.floor((t - 0.3) * N)) : 0,
            // Seconds per tile shrink as you climb within a size
            time: Math.round(25 + missing * (22 - 10 * t)),
            // Late in each size (from 4×4 on) the per-line dots go away
            guides: N === 3 || t < 0.75,
            unique: N !== 6,
        };
    }

    function rankFor(L) {
        if (L >= 12) return 'אגדה';
        if (L >= 10.5) return 'מאסטר';
        if (L >= 8) return 'מחונן';
        if (L >= 6) return 'מומחה';
        if (L >= 4.5) return 'חד';
        if (L >= 3) return 'מתקדם';
        return 'חושב מתחיל';
    }

    /* ============================
       Progress & adaptive difficulty

       The level is a continuous rating from 1.0 to 12.0. After every board:
       - A win that was clearly easy (fast and with few wasted moves) jumps the
         level up, and consecutive easy wins jump further each time — so a
         player who is far below their ability gets there in a few boards.
       - Below the player's peak, wins climb back quickly.
       - At the peak, ordinary wins are heavily damped: the player has to win
         well, repeatedly, to push the peak higher. That is the "stuck at your
         ceiling" feeling.
       - A loss drops the level, and consecutive losses drop it further, so a
         player who is over their head comes down fast.
       ============================ */
    const DAILY_GOAL = 5;

    function freshProgress(lvl = 1.0) {
        return {
            peak: lvl, easyStreak: 0, failStreak: 0, played: 0,
            xp: 0, winStreak: 0, bestWinStreak: 0, maxN: 3,
            dayStreak: 0, lastWinDay: null, today: { date: null, wins: 0 },
            achievements: [],
        };
    }

    let level = parseFloat(store.get('klox_level')) || 1.0;
    let progress = (() => {
        const base = freshProgress(level);
        try {
            const p = JSON.parse(store.get('klox_progress'));
            if (p && typeof p.peak === 'number') return Object.assign(base, p);
        } catch (e) {}
        return base;
    })();

    function saveProgress() {
        store.set('klox_level', level.toFixed(2));
        store.set('klox_progress', JSON.stringify(progress));
    }

    function dayKey(d = new Date()) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function yesterdayKey() {
        const d = new Date();
        d.setDate(d.getDate() - 1);
        return dayKey(d);
    }
    function todayWins() {
        return progress.today.date === dayKey() ? progress.today.wins : 0;
    }
    // A streak that skipped yesterday is already broken, even before today's first win
    function liveDayStreak() {
        return (progress.lastWinDay === dayKey() || progress.lastWinDay === yesterdayKey()) ? progress.dayStreak : 0;
    }

    function performance01(stats) {
        // mostly speed, some move efficiency
        return 0.6 * (1 - stats.timeFrac) + 0.4 * stats.efficiency;
    }

    // Returns { before, after, delta, tag } and updates level/progress.
    function applyResult(won, perf) {
        const before = level;
        const atCeiling = before >= progress.peak - 0.05;
        let delta;
        let tag;

        if (won) {
            progress.failStreak = 0;
            if (perf >= 0.72) {
                progress.easyStreak++;
                delta = 0.4 + 0.2 * Math.min(3, progress.easyStreak - 1); // 0.4, 0.6, 0.8, 1.0
                tag = 'fast';
            } else {
                progress.easyStreak = 0;
                delta = perf >= 0.45 ? 0.2 : 0.08;
                if (atCeiling) {
                    delta *= 0.4; // the grind at the top
                    tag = 'ceiling';
                } else {
                    delta *= 1.5; // recovering ground you already proved
                    // ...but only up to the peak; anything past it is damped like the grind
                    const over = before + delta - progress.peak;
                    if (over > 0) delta -= over * 0.6;
                    tag = 'up';
                }
            }
        } else {
            progress.easyStreak = 0;
            progress.failStreak++;
            delta = -Math.min(1.0, 0.25 + 0.15 * (progress.failStreak - 1));
            tag = 'drop';
        }

        level = Math.min(MAX_LEVEL, Math.max(MIN_LEVEL, Math.round((before + delta) * 100) / 100));
        progress.peak = Math.max(progress.peak, level);
        progress.played++;
        return { before, after: level, delta: level - before, tag };
    }

    /* ============================
       Rewards: stars, XP, streaks, daily goal, achievements
       ============================ */
    const ACHIEVEMENTS = [
        { id: 'first',   name: 'ניצחון ראשון',       desc: 'פתרת לוח' },
        { id: 'perfect', name: 'מושלם',              desc: 'שלושה כוכבים' },
        { id: 'size4',   name: 'לוח 4×4',            desc: 'הגעת ל־4×4' },

    function unlockAchievement(id, out) {
        if (progress.achievements.includes(id)) return;
        progress.achievements.push(id);
        out.push(ACHIEVEMENTS.find(a => a.id === id));
    }

    function starsFor(perf) {
        return perf >= 0.72 ? 3 : perf >= 0.45 ? 2 : 1;
    }

    // Called once per won board, after applyResult.
    function grantRewards(stars, stats) {
        const newAch = [];
        progress.winStreak++;
        progress.bestWinStreak = Math.max(progress.bestWinStreak, progress.winStreak);

        // Day streak and today's count
        const today = dayKey();
        if (progress.lastWinDay !== today) {
            progress.dayStreak = progress.lastWinDay === yesterdayKey() ? progress.dayStreak + 1 : 1;
            progress.lastWinDay = today;
        }
        if (progress.today.date !== today) progress.today = { date: today, wins: 0 };
        progress.today.wins++;
        const dailyJustDone = progress.today.wins === DAILY_GOAL;

        // XP: tiles placed × stars × win-streak combo × golden
        const base = params.missing * 10;
        const starMult = [1, 1, 1.5, 2][stars];
        const combo = 1 + 0.25 * Math.min(4, progress.winStreak - 1); // up to ×2
        const goldMult = golden ? 2 : 1;
        let xp = Math.round(base * starMult * combo * goldMult);
        const dailyBonus = dailyJustDone ? 100 : 0;
        progress.xp += xp + dailyBonus;

        unlockAchievement('first', newAch);
        if (stars === 3) unlockAchievement('perfect', newAch);
        if (progress.winStreak >= 5) unlockAchievement('streak5', newAch);
        if (progress.winStreak >= 10) unlockAchievement('streak10', newAch);
        if (stats.timeFrac <= 0.25) unlockAchievement('speed', newAch);
        if (golden) unlockAchievement('golden', newAch);
        if (dailyJustDone) unlockAchievement('daily', newAch);
        if (progress.dayStreak >= 3) unlockAchievement('days3', newAch);
        if (progress.dayStreak >= 7) unlockAchievement('days7', newAch);
        if (progress.xp >= 1000) unlockAchievement('xp1000', newAch);
        if (progress.peak >= 8) unlockAchievement('peak8', newAch);

        return { xp, base, starMult, combo, goldMult, dailyBonus, dailyJustDone, newAch };
    }

    let params = levelParams(level);

    let trayState = [];    // [{color, shape, id}]

    function formatTime(s) {

    /* ============================
       Puzzle generation
       ============================ */
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Multiplication in GF(4) = {0, 1, x, x+1} with x² = x + 1; addition is XOR.
    const GF4_MUL = [[0, 0, 0, 0], [0, 1, 2, 3], [0, 2, 3, 1], [0, 3, 1, 2]];

    // Two N×N Latin squares (colour index, shape index). For N = 3, 4, 5, 7 they are
    // orthogonal, so every colour+shape pair appears exactly once.
    function baseSquares(n) {
        const a = [], b = [];
        for (let r = 0; r < n; r++) {
            for (let c = 0; c < n; c++) {
                if (n === 4) {
                    a.push(r ^ c);
                    b.push(GF4_MUL[2][r] ^ c);
                } else if (n === 6) {
                    // No orthogonal pair exists; two independent Latin squares
                    a.push((r + c) % 6);
                    b.push((c - r + 6) % 6);
                } else {
                    a.push((r + c) % n);
                    b.push((r + 2 * c) % n);
                }
            }
        }
        return [a, b];
    }

    // Permuting rows, columns and symbols (and transposing) keeps every rule,
    // so each board gets a fresh solution instead of the same one every time.
    function generateValidBoard(n) {
        let [a, b] = baseSquares(n);
        if (n === 6) {
            // make the second square less predictable: shuffle its rows, which keeps it Latin
            const rp = shuffle([...Array(6).keys()]);
            b = b.map((_, i) => b[rp[Math.floor(i / 6)] * 6 + (i % 6)]);
        }
        const rows = shuffle([...Array(n).keys()]);
        const cols = shuffle([...Array(n).keys()]);
        const colorMap = shuffle([...colors]);
        const shapeMap = shuffle([...shapes]);
        const transpose = Math.random() < 0.5;
        const flip = Math.random() < 0.5;

        const solution = [];
        for (let r = 0; r < n; r++) {
            for (let c = 0; c < n; c++) {
                let rr = rows[r], cc = cols[c];
                if (transpose) [rr, cc] = [cc, rr];
                const i = rr * n + cc;
                solution.push({
                    color: colorMap[flip ? b[i] : a[i]],
                    shape: shapeMap[flip ? a[i] : b[i]],
                });
            }
        }
        return solution;
    }

    function updateHud() {
        document.getElementById('levelDisplay').innerText = level.toFixed(1);
        document.getElementById('peakDisplay').innerText = progress.peak.toFixed(1);
        document.getElementById('rankTitle').innerText = rankFor(level);
        document.getElementById('sizeDisplay').innerText = `${N}×${N}`;
        document.getElementById('streakDisplay').innerText = liveDayStreak();
        document.getElementById('xpDisplay').innerText = progress.xp.toLocaleString();

        // Goal gradient: always show how close the next milestone is
        const p = levelParams(level);
        let label, fill;
        if (p.nextAt) {
            label = `בדרך ללוח ${p.N + 1}×${p.N + 1}`;
            fill = p.t;
        } else {
            label = `בדרך לפסגה ${MAX_LEVEL.toFixed(0)}`;
            fill = p.t;
        }
        if (level >= progress.peak - 0.05 && progress.played > 0) label += ' · ⛰ על השיא';
        document.getElementById('goalLabel').innerHTML = `${label} <b>${Math.floor(fill * 100)}%</b>`;
        document.getElementById('goalFill').style.width = (fill * 100) + '%';

        const w = todayWins();
        document.getElementById('dailyLabel').innerHTML = w >= DAILY_GOAL
            ? `<span class="done">✓ יעד יומי</span>`
            : `יעד יומי <b>${w}/${DAILY_GOAL}</b>`;
    }

    function initLevel() {
        clearSelection();
        steps = 0;
        gameOver = false;
        popIndex = null;
        lineCombo = 0;

        params = levelParams(level);
        N = params.N;
        colors = ALL_COLORS.slice(0, N);
        shapes = ALL_SHAPES.slice(0, N);
        totalTime = params.time;
        timeLeft = totalTime;
        updateTimerUI();

        // Variable reward: one board in eight is golden and pays double
        golden = progress.played > 0 && Math.random() < 0.125;

        const bc = document.getElementById('boardContainer');
        bc.className = 'board-container size-' + N + (golden ? ' golden' : '');
        const grid = document.getElementById('boardGrid');
        grid.style.gridTemplateColumns = `repeat(${N}, minmax(0, 1fr)) var(--dot-track)`;
        grid.style.gridTemplateRows = `var(--dot-track) repeat(${N}, minmax(0, 1fr))`;
        grid.classList.toggle('no-guides', !params.guides);
        document.getElementById('chipUnique').style.display = params.unique ? '' : 'none';
        updateHud();

        const cells = N * N;
        const solution = generateValidBoard(N);
        const order = shuffle([...Array(cells).keys()]);
        const missingPos = order.slice(0, params.missing);

        boardState = Array(cells).fill(null);
        trayState = [];
        let idCounter = 1;

        order.forEach((pos, i) => {
            const item = { ...solution[pos], id: 't_' + idCounter++ };
            if (i < params.missing) {
                trayState.push(item);
            } else {
                item.locked = true;
                boardState[pos] = item;
            }
        });

        // Scrambled: some of the missing tiles start on the board, in a wrong slot.
        const s = Math.min(params.scrambled, missingPos.length - 1);
        if (s > 0) {
            const from = missingPos.slice(0, s);
            // Rotate them among their own slots, or (one tile) put it in another empty slot
            const to = s >= 2 ? [...from.slice(1), from[0]] : [missingPos[1]];
            from.forEach((p, k) => {
                const want = solution[p];
                const idx = trayState.findIndex(t => t.color === want.color && t.shape === want.shape);
                boardState[to[k]] = trayState.splice(idx, 1)[0];
            });
        }

        // Roughly the fewest moves a perfect player needs
        minSteps = params.missing;

        shuffle(trayState);
        initialSnap = snapshot();
        undoStack = [];
        wheelAngle = null; // centre the wheel on the middle tile
        validLines = new Set();
        clashLines = new Set();
        render(true);
        setPaused(false);
        if (golden) { toast('✨ לוח זהב!', 'הנקודות על הלוח הזה כפולות'); Sound.coin(); }
    }

    function createTileElement(data, isSelected) {

        const shape = document.createElement('div');

        tile.appendChild(shape);

            tile.appendChild(lock.firstChild);
        }
        return tile;
    }

    function render(silent = false) {
        // 1. Tray wheel — the angle survives re-renders
        const trayEl = document.getElementById('traySlots');

            trayEl.appendChild(slot);
        });
        if (trayState.length === 0) {
            const empty = document.createElement('span');
            empty.className = 'tray-empty';

            trayEl.appendChild(empty);
        }
        document.getElementById('trayCountDisplay').innerText = `${trayState.length} נותרו`;
        layoutWheel();
        updateToolButtons();

        // 2. Board
        const grid = document.getElementById('boardGrid');
        grid.innerHTML = '';

        for (let c = 0; c < N; c++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-col-${c}`;
            dot.style.gridRow = '1';
            dot.style.gridColumn = `${c + 1}`;
            grid.appendChild(dot);
        }

        boardState.forEach((item, index) => {
            const r = Math.floor(index / N);
            const c = index % N;

            if (c === 0) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.id = `dot-row-${r}`;
                dot.style.gridRow = `${r + 2}`;
                dot.style.gridColumn = `${N + 1}`;
                grid.appendChild(dot);
            }

            const slot = document.createElement('div');
            slot.className = 'slot' + (item?.locked ? ' locked' : '');
            slot.style.gridRow = `${r + 2}`;
            slot.style.gridColumn = `${c + 1}`;
            slot.dataset.drop = 'board';
            slot.dataset.index = index;

            if (item) {
                const isSel = selectedSource === 'board' && selectedIndex === index;
                const tile = createTileElement(item, isSel);
                if (popIndex === index) tile.classList.add('pop');
                if (!item.locked) {
                    tile.dataset.src = 'board';
                    tile.dataset.index = index;
                }
                tile.addEventListener('click', (e) => { e.stopPropagation(); handleBoardClick(index, tile); });
                slot.appendChild(tile);
            } else {
                slot.addEventListener('click', () => handleBoardClick(index, slot));
            }
            grid.appendChild(slot);
        });
        popIndex = null;

        validateState(silent);
    }

    /* ============================
       Tray wheel geometry

       Tiles sit on a circle whose centre is far below the screen, so only a
       shallow arc shows. Tile i is at angle wheelAngle + i·step from the top;
       angle 0 is the top centre. The first tile is on the right (RTL), the
       rest run leftward and down out of sight.
       ============================ */
    let wheelAngle = null;
    let wheel = { R: 300, step: 0.2, cx: 0, cy: 0 };
    let wheelAnim = null;
    let wheelNearest = -1;
    const WHEEL_PITCH = 64;    // px along the arc between tiles

    function wheelMinAngle() {
        return -Math.max(0, trayState.length - 1) * wheel.step;
    }

    function setWheelAngle(a) {
        wheelAngle = Math.max(wheelMinAngle(), Math.min(0, a));
        positionWheelTiles();
        // a soft click each time a new tile reaches the top
        const nearest = Math.round(-wheelAngle / wheel.step);
        if (nearest !== wheelNearest) {
            if (wheelNearest !== -1 && (drag?.mode === 'spin' || wheelAnim)) { Sound.click(); buzz(2); }
            wheelNearest = nearest;
        }
    }

    function layoutWheel() {
        const box = document.getElementById('trayContainer');
        const W = box.clientWidth || 360;
        const apexY = box.clientHeight - 60; // centre of the top tile, from the top of the tray
        wheel.R = Math.max(240, Math.min(440, W * 0.85));
        wheel.step = WHEEL_PITCH / wheel.R;
        wheel.cx = W / 2;
        wheel.cy = apexY + wheel.R;

        const disc = document.getElementById('wheelDisc');
        const dr = wheel.R + 44;
        disc.style.width = disc.style.height = dr * 2 + 'px';
        disc.style.left = (wheel.cx - dr) + 'px';
        disc.style.top = (wheel.cy - dr) + 'px';

        if (wheelAngle === null) wheelAngle = -Math.floor((trayState.length - 1) / 2) * wheel.step;
        wheelNearest = -1;
        setWheelAngle(wheelAngle);
    }

    function positionWheelTiles() {
        const slots = document.querySelectorAll('#traySlots .tray-slot');
        slots.forEach((slot, i) => {
            const th = wheelAngle + i * wheel.step;
            if (Math.abs(th) > 1.1) { slot.style.visibility = 'hidden'; return; }
            slot.style.visibility = '';
            const x = wheel.cx - wheel.R * Math.sin(th);
            const y = wheel.cy - wheel.R * Math.cos(th);
            // tiles near the top are a touch bigger, so the "current" one stands out
            const sc = 1.08 - 0.22 * Math.min(1, Math.abs(th) / (wheel.step * 3));
            slot.style.transform = `translate(${x}px, ${y}px) scale(${sc.toFixed(3)})`;
        });
        document.getElementById('wheelDisc').style.setProperty('--spin', (-wheelAngle) + 'rad');
    }

    function stopWheelMotion() {
        if (wheelAnim) cancelAnimationFrame(wheelAnim);
        wheelAnim = null;
    }

    // Coast with the release velocity (rad/ms), then settle with a tile on top.
    function spinWheel(v) {
        stopWheelMotion();
        let last = performance.now();
        const frame = (now) => {
            const dt = Math.min(32, now - last);
            last = now;
            if (Math.abs(v) > 0.00004) {
                const before = wheelAngle;
                setWheelAngle(wheelAngle + v * dt);
                if (wheelAngle === before) v = 0; // hit an end
                v *= Math.pow(0.93, dt / 16);
            } else {
                const target = Math.round(wheelAngle / wheel.step) * wheel.step;
                const d = target - wheelAngle;
                if (Math.abs(d) < 0.0006) { setWheelAngle(target); wheelAnim = null; return; }
                setWheelAngle(wheelAngle + d * 0.25);
            }
            wheelAnim = requestAnimationFrame(frame);
        };
        wheelAnim = requestAnimationFrame(frame);
    }

    window.addEventListener('resize', () => layoutWheel());

    // A mouse wheel turns the tray wheel
    document.getElementById('trayContainer').addEventListener('wheel', (e) => {
        e.preventDefault();
        stopWheelMotion();
        setWheelAngle(wheelAngle - (e.deltaY || e.deltaX) / wheel.R * 0.6);
        clearTimeout(e.currentTarget._settle);
        e.currentTarget._settle = setTimeout(() => spinWheel(0), 120);
    }, { passive: false });

    /* ============================
       Undo & reset
       ============================ */
    function snapshot() {
        return {
            board: boardState.map(x => x && { ...x }),
            tray: trayState.map(x => ({ ...x })),
        };
    }

    function pushUndo() {
        undoStack.push(snapshot());
        if (undoStack.length > 300) undoStack.shift();
    }

    function restore(snap) {
        boardState = snap.board.map(x => x && { ...x });
        trayState = snap.tray.map(x => ({ ...x }));
        clearSelection();
    }

    function updateToolButtons() {
        document.getElementById('undoBtn').disabled = gameOver || undoStack.length === 0;
        document.getElementById('resetBtn').disabled = gameOver || undoStack.length === 0;
    }

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (isPaused || gameOver || !undoStack.length) return;
        cancelDrag();
        restore(undoStack.pop());
        steps++; // an undo is still a move, so it costs a little on stars
        Sound.back();
        render();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        if (isPaused || gameOver || !undoStack.length) return;
        cancelDrag();
        setPaused(true);
        showDialog('לאפס את הלוח?', 'כל האריחים שהנחת יחזרו לגלגל.\nהשעון ממשיך מאותו מקום.', [
            { label: 'כן, לאפס', cls: 'btn-danger', action: () => {
                pushUndo(); // so an accidental reset can be undone
                restore(initialSnap);
                wheelAngle = null;
                Sound.back();
                setPaused(false);
                render();
            } },
            { label: 'ביטול', cls: 'btn-secondary', action: () => setPaused(false) },
        ]);
    });

    /* ============================
       Moves (shared by tap and drag)
       ============================ */
    function placeFromTray(id, index) {
        const tIdx = trayState.findIndex(t => t.id === id);
        if (tIdx < 0 || boardState[index]?.locked) return false;
        pushUndo();
        const item = trayState.splice(tIdx, 1)[0];
        if (boardState[index]) trayState.push(boardState[index]); // occupant goes back
        boardState[index] = item;
        steps++;
        popIndex = index;
        Sound.drop();
        buzz(8);
        return true;
    }

    function moveOnBoard(from, to) {
        if (from === to) return false;
        if (boardState[to]?.locked || boardState[from]?.locked) return false;
        pushUndo();
        const hadOccupant = !!boardState[to];
        [boardState[from], boardState[to]] = [boardState[to], boardState[from]];
        steps++;
        popIndex = to;
        hadOccupant ? Sound.swap() : Sound.drop();
        buzz(8);
        return true;
    }

    function returnToTray(index) {
        const item = boardState[index];
        if (!item || item.locked) return false;
        pushUndo();
        boardState[index] = null;
        trayState.push(item);
        steps++;
        Sound.back();
        return true;
    }

    function rejectMove(el) {
        Sound.nope();
        buzz([20, 40, 20]);
        if (el) {
            el.classList.remove('shake');
            void el.offsetWidth;
            el.classList.add('shake');
        }
    }

    function clearSelection() {
        selectedSource = null;
        selectedId = null;
        selectedIndex = null;
    }

    function afterMove() {
        render();
    }

    /* ============================
       Tap interactions
       ============================ */
    function handleTrayClick(id) {
        if (isPaused || gameOver) return;
        if (selectedSource === 'tray' && selectedId === id) {
            clearSelection();
        } else {
            selectedSource = 'tray';
            selectedId = id;
            selectedIndex = null;
            Sound.select();
        }
        render(true);
    }

    function handleBoardClick(index, el) {
        if (isPaused || gameOver) return;
        const item = boardState[index];

        if (item?.locked) {
            if (selectedSource) rejectMove(el);
            return;
        }

        if (selectedSource === 'tray') {
            placeFromTray(selectedId, index);
            clearSelection();
        } else if (selectedSource === 'board') {
            if (selectedIndex === index) {
                // Second tap on the same tile sends it back to the tray
                returnToTray(index);
            } else {
                moveOnBoard(selectedIndex, index);
            }
            clearSelection();
        } else if (item) {
            // Select a placed tile: next tap moves/swaps it, or tap it again to return it
            selectedSource = 'board';
            selectedIndex = index;
            Sound.select();
            render(true);
            return;
        } else {
            return;
        }
        afterMove();
    }

    // Tapping the tray while a board tile is selected sends that tile back
    document.getElementById('trayContainer').addEventListener('click', () => {
        if (isPaused || gameOver || selectedSource !== 'board') return;
        returnToTray(selectedIndex);
        clearSelection();
        afterMove();
    });

    /* ============================
       Drag & drop (pointer events: mouse, touch and pen alike)
       ============================ */
    const DRAG_THRESHOLD = 6; // px before a press becomes a drag rather than a tap
    let drag = null;
    let suppressClickUntil = 0;

    document.addEventListener('pointerdown', (e) => {
        if (isPaused || gameOver || e.button > 0 || drag) return;
        const tile = e.target.closest('.tile[data-src]');
        const inWheel = !!e.target.closest('#trayContainer');
        if (!tile && !inWheel) return;
        if (inWheel) stopWheelMotion();
        drag = {
            src: tile ? tile.dataset.src : null,
            id: tile ? tile.dataset.id : null,
            index: tile && tile.dataset.index !== undefined ? +tile.dataset.index : null,
            el: tile,
            inWheel,
            mode: null, // decided on the first real movement: 'spin' or 'tile'
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            startAngle: wheelAngle,
            lastX: e.clientX,
            lastT: performance.now(),
            vel: 0,
            ghost: null,
            target: null,
        };
    });

    document.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
        if (!drag.mode) {
            if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
            if (drag.inWheel && (!drag.el || Math.abs(dx) > Math.abs(dy) || dy > 0)) {
                // sideways (or downward) on the wheel turns it
                drag.mode = 'spin';
            } else if (drag.el) {
                // upward from the wheel, or anything on the board, picks the tile up
                drag.mode = 'tile';
                startDragVisual();
            } else {
                drag = null;
                return;
            }
        }
        e.preventDefault();

        if (drag.mode === 'spin') {
            const now = performance.now();
            setWheelAngle(drag.startAngle - dx / wheel.R);
            const inst = -(e.clientX - drag.lastX) / wheel.R / Math.max(1, now - drag.lastT);
            drag.vel = 0.6 * inst + 0.4 * drag.vel;
            drag.lastX = e.clientX;
            drag.lastT = now;
            return;
        }

        drag.ghost.style.left = e.clientX + 'px';
        drag.ghost.style.top = e.clientY + 'px';
        updateDropTarget(e.clientX, e.clientY);
    }, { passive: false });

    document.addEventListener('pointerup', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        if (!drag.mode) { // a tap — the click handler takes it
            const wasWheel = drag.inWheel;
            drag = null;
            if (wasWheel) spinWheel(0); // settle if a tap interrupted a coast
            return;
        }
        suppressClickUntil = performance.now() + 300;
        if (drag.mode === 'spin') {
            // a finger that stopped before lifting does not fling
            const v = performance.now() - drag.lastT > 80 ? 0 : drag.vel;
            drag = null;
            spinWheel(v);
            return;
        }
        const target = drag.target;
        const d = drag;
        cancelDrag();
        performDrop(d, target);
    });

    // The browser or the system took the gesture
    document.addEventListener('pointercancel', (e) => {
        if (drag && e.pointerId === drag.pointerId) cancelDrag();
    });

    // A drag ends with a click on whatever was under the finger; swallow it.
    document.addEventListener('click', (e) => {
        if (performance.now() < suppressClickUntil && !e.target.closest('.modal-overlay, header')) {
            e.stopPropagation();
            e.preventDefault();
        }
    }, true);

    function startDragVisual() {
        const rect = drag.el.getBoundingClientRect();
        const size = Math.max(rect.width, 48);
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.style.width = size + 'px';
        ghost.style.height = size + 'px';
        const shape = drag.el.querySelector('.shape').cloneNode(true);
        ghost.appendChild(shape);
        document.body.appendChild(ghost);
        drag.ghost = ghost;
        drag.el.classList.add('drag-origin');
        clearSelection();
        document.querySelectorAll('.tile.selected').forEach(t => t.classList.remove('selected'));
        Sound.pick();
        buzz(5);
    }

    function clearDropHighlights() {
        document.querySelectorAll('.drop-ok, .drop-bad').forEach(el => el.classList.remove('drop-ok', 'drop-bad'));
    }

    function updateDropTarget(x, y) {
        clearDropHighlights();
        const el = document.elementFromPoint(x, y);
        const zone = el && el.closest('[data-drop]');
        drag.target = null;
        if (!zone) return;

        if (zone.dataset.drop === 'board') {
            const idx = +zone.dataset.index;
            const ok = !boardState[idx]?.locked && !(drag.src === 'board' && drag.index === idx);
            zone.classList.add(ok ? 'drop-ok' : 'drop-bad');
            drag.target = { kind: 'board', index: idx, ok };
        } else if (zone.dataset.drop === 'tray' && drag.src === 'board') {
            zone.classList.add('drop-ok');
            drag.target = { kind: 'tray', ok: true };
        }
    }

    function performDrop(d, target) {
        if (!target) { render(true); return; } // dropped nowhere: snap back
        if (!target.ok) { render(true); rejectMove(document.querySelector(`.slot[data-index="${target.index}"]`)); return; }

        let moved = false;
        if (target.kind === 'board') {
            moved = d.src === 'tray' ? placeFromTray(d.id, target.index) : moveOnBoard(d.index, target.index);
        } else if (target.kind === 'tray') {
            moved = returnToTray(d.index);
        }
        if (moved) afterMove(); else render(true);
    }

    function cancelDrag() {
        if (!drag) return;
        if (drag.ghost) drag.ghost.remove();
        if (drag.el) drag.el.classList.remove('drag-origin');
        if (drag.mode === 'spin') spinWheel(0);
        clearDropHighlights();
        drag = null;
    }

    /* ============================
       Validation
       ============================ */
    function lineOk(items) {
        if (items.some(x => !x)) return false;
        return new Set(items.map(x => x.color)).size === N && new Set(items.map(x => x.shape)).size === N;
    }

    // Board indices in a line that repeat a colour or a shape already in it.
    function lineClashes(indices) {
        const out = [];
        for (const key of ['color', 'shape']) {
            const seen = {};
            indices.forEach(i => { const x = boardState[i]; if (x) (seen[x[key]] ||= []).push(i); });
            Object.values(seen).forEach(list => { if (list.length > 1) out.push(...list); });
        }
        return out;
    }

    function validateState(silent = false) {
        let rowsV = true, colsV = true;
        const nowValid = new Set();
        const nowClash = new Set();
        const clashTiles = new Set();
        const pairs = new Set();
        let filled = 0;

        for (let i = 0; i < N; i++) {
            const rowIdx = [], colIdx = [];
            for (let k = 0; k < N; k++) {
                rowIdx.push(i * N + k);
                colIdx.push(k * N + i);
            }
            const rv = lineOk(rowIdx.map(j => boardState[j]));
            const cv = lineOk(colIdx.map(j => boardState[j]));
            // A repeat shows red at once, before the line is full
            const rc = lineClashes(rowIdx);
            const cc = lineClashes(colIdx);
            rc.forEach(j => clashTiles.add(j));
            cc.forEach(j => clashTiles.add(j));
            document.getElementById(`dot-row-${i}`).className = 'dot' + (rv ? ' valid' : rc.length ? ' clash' : '');
            document.getElementById(`dot-col-${i}`).className = 'dot' + (cv ? ' valid' : cc.length ? ' clash' : '');
            if (rv) nowValid.add('r' + i); else rowsV = false;
            if (cv) nowValid.add('c' + i); else colsV = false;
            if (rc.length) nowClash.add('r' + i);
            if (cc.length) nowClash.add('c' + i);
        }

        // Outline the clashing tiles — only where the guides are shown, like the dots
        document.querySelectorAll('.slot.clash').forEach(s => s.classList.remove('clash'));
        if (params.guides) {
            clashTiles.forEach(j => document.querySelector(`.slot[data-index="${j}"]`)?.classList.add('clash'));
        }
        // A soft bonk when a move creates a new clash
        if (!silent && params.guides && [...nowClash].some(k => !clashLines.has(k))) {
            setTimeout(() => Sound.clash(), 60);
        }
        clashLines = nowClash;
        boardState.forEach(x => { if (x) { filled++; pairs.add(x.color + x.shape); } });

        const uniqV = !params.unique || (filled === N * N && pairs.size === N * N);

        document.getElementById('chipRows').className = 'chip' + (rowsV ? ' valid' : '');
        document.getElementById('chipCols').className = 'chip' + (colsV ? ' valid' : '');
        document.getElementById('chipUnique').className = 'chip' + (params.unique && uniqV ? ' valid' : '');

        const won = rowsV && colsV && uniqV && trayState.length === 0;

        // A chime when a line newly completes — rising if lines come quickly.
        // Only where the guides are shown, or it would give away what the hidden dots hide.
        const fresh = [...nowValid].some(k => !validLines.has(k));
        if (!silent && !won && params.guides && fresh) {
            const now = performance.now();
            lineCombo = now - lastLineAt < 5000 ? lineCombo + 1 : 0;
            lastLineAt = now;
            const combo = lineCombo;
            setTimeout(() => Sound.line(combo), 90);
        }
        validLines = nowValid;

        if (won && !gameOver) endGame(true);
    }

    /* ============================
       End of a board
       ============================ */
    function confetti(count = 36) {
        const palette = ['var(--color-red)', 'var(--color-blue)', 'var(--color-green)', 'var(--color-yellow)', 'var(--color-purple)', 'var(--accent)'];
        for (let i = 0; i < count; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            const angle = Math.random() * Math.PI * 2;
            const dist = 120 + Math.random() * 180;
            c.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
            c.style.setProperty('--dy', Math.sin(angle) * dist + 120 + 'px');
            c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
            c.style.background = palette[i % palette.length];
            c.style.borderRadius = i % 3 === 0 ? '50%' : '3px';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 1300);
        }
    }

    function showLevelChange(res) {
        const badge = document.getElementById('levelBadge');
        badge.classList.remove('up', 'down');
        void badge.offsetWidth;
        updateHud();
        if (Math.abs(res.delta) < 0.005) return;
        badge.classList.add(res.delta > 0 ? 'up' : 'down');
        const d = document.createElement('span');
        d.className = 'level-delta ' + (res.delta > 0 ? 'pos' : 'neg');
        d.dir = 'ltr';
        d.innerText = (res.delta > 0 ? '+' : '−') + Math.abs(res.delta).toFixed(2);
        badge.appendChild(d);
        setTimeout(() => d.remove(), 1500);
    }

    function levelChangeHtml(res) {
        const tags = {
            fast: '⚡ קל לך מדי — קפיצה',
            up: '↗ חוזר לשיא',
            ceiling: '⛰ על השיא — כל צעד קשה',
            drop: '↘ יורדים קצת',
        };
        const sign = res.delta >= 0 ? '+' : '−';
        return `<div class="level-change"><span class="nums">${res.before.toFixed(1)} ← ${res.after.toFixed(1)}</span>`
            + `<span class="tag ${res.tag}"><bdi dir="ltr">${sign}${Math.abs(res.delta).toFixed(2)}</bdi> · ${tags[res.tag]}</span></div>`;
    }

    function rewardHtml(r) {
        const parts = [`${r.base} בסיס`];
        if (r.starMult > 1) parts.push(`כוכבים <bdi dir="ltr">×${r.starMult}</bdi>`);
        if (r.combo > 1) parts.push(`רצף <bdi dir="ltr">×${r.combo}</bdi>`);
        if (r.goldMult > 1) parts.push(`זהב ×2`);
        let html = `<div class="reward"><b><bdi dir="ltr">+${r.xp}</bdi> ⭐</b><br>${parts.join(' · ')}`;
        if (r.dailyBonus) html += `<br>🎯 יעד יומי הושלם: <b><bdi dir="ltr">+${r.dailyBonus}</bdi></b>`;
        return html + '</div>';
    }

    // won: solved the board. skipped: gave up from settings.
    function endGame(won, skipped = false) {
        if (gameOver) return;
        gameOver = true;
        cancelDrag();
        clearInterval(timerInterval);
        updateToolButtons();

        const stats = {
            timeFrac: (totalTime - timeLeft) / totalTime,
            efficiency: steps > 0 ? Math.min(1, minSteps / steps) : 1,
        };
        const perf = performance01(stats);
        const stars = won ? starsFor(perf) : 0;
        const prevPeak = progress.peak;
        const res = applyResult(won, perf);
        const reward = won ? grantRewards(stars, stats) : null;
        if (!won) progress.winStreak = 0;

        // Did this result open a bigger board for the first time?
        const nextN = levelParams(level).N;
        const unlockedN = nextN > progress.maxN ? nextN : null;
        if (unlockedN) {
            progress.maxN = nextN;
            const extra = [];
            unlockAchievement('size' + nextN, extra);
            if (reward) reward.newAch.push(...extra);
        }
        saveProgress();

        const newRecord = won && res.after > prevPeak + 0.005;
        const usedSec = totalTime - timeLeft;
        const placed = N * N - boardState.filter(Boolean).length;

        setTimeout(() => {
            if (won) {
                Sound.win();
                confetti(golden ? 60 : 36);
                buzz([30, 50, 30]);
            } else {
                Sound.lose();
            }
            setTimeout(() => {
                showLevelChange(res);
                if (res.delta > 0.005) Sound.levelUp(); else if (res.delta < -0.005) Sound.levelDown();
            }, 450);

            let title, msg;
            if (unlockedN) {
                title = `לוח ${unlockedN}×${unlockedN} נפתח! 🎉`;
                msg = NEW_IN_SIZE[unlockedN];
                setTimeout(() => { Sound.unlock(); confetti(80); }, 900);
            } else if (won) {
                title = newRecord ? 'שיא חדש! 🏆' : (stars === 3 ? 'מושלם! 🧩' : 'פתרת! 🧩');
                msg = `${steps} צעדים · ${usedSec} שניות`;
                if (stars < 3) msg += `\nעוד קצת יותר מהר — ושלושה כוכבים שלך`;
            } else if (skipped) {
                title = 'דילגת על הלוח';
                msg = 'נוריד קצת את הרמה ונמשיך.';
            } else {
                title = 'הזמן נגמר! ⏰';
                // Near-miss framing: how close it was is the reason to go again
                msg = placed <= 2
                    ? `כמעט! חסרו רק ${placed === 1 ? 'אריח אחד' : 'שני אריחים'}.`
                    : 'לא הספקת הפעם. הלוח הבא יהיה קצת יותר קל.';
            }
            if (progress.winStreak >= 2 && won) msg += `\n🔥 ${progress.winStreak} ניצחונות ברצף`;

            const extraHtml = (reward ? rewardHtml(reward) : '') + levelChangeHtml(res);
            showDialog(title, msg, [
                { label: unlockedN ? `ללוח ה־${unlockedN}×${unlockedN}` : 'ללוח הבא', cls: 'btn-primary', action: initLevel,
                  autoMs: unlockedN ? 0 : (won ? 3500 : 4500) },
            ], { stars, extraHtml });

            if (reward) {
                const xpStat = document.getElementById('xpStat');
                xpStat.classList.remove('bump'); void xpStat.offsetWidth; xpStat.classList.add('bump');
                setTimeout(() => Sound.coin(), 950);
                reward.newAch.forEach((a, i) => setTimeout(() => { toast('🏅 ' + a.name, a.desc); Sound.coin(); }, 1300 + i * 700));
                if (reward.dailyJustDone) setTimeout(() => toast('🎯 יעד יומי הושלם!', 'נתראה מחר — אל תשבור את הרצף 🔥'), 1000);
            }
        }, won ? 300 : 0);
    }

    // Startup
    applyThemeUI();
    applySoundUI();
    initLevel();
    if (liveDayStreak() > 0 && todayWins() === 0) {
        setTimeout(() => toast(`🔥 רצף של ${liveDayStreak()} ימים`, 'נצח לוח אחד היום כדי לשמור עליו'), 600);
    }
</script>
</body>
</html>
