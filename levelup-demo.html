<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#eef2f7">
<title>Klox · level-up demo</title>
<style>
    /* A throwaway page to choose the level-up animation. It uses the game's
       light theme, its natural "pictures" palette and the same picture
       sprites, so each option is seen the way it would look in the game. */
    :root {
        --bg-base: #eef2f7; --bg-surface: #fff; --bg-slot: #e2e8f0; --border: #cbd5e1;
        --text: #0f172a; --muted: #64748b; --accent: #2563eb; --gold: #d97706;
        --c1: #d9534f; --c2: #3a7bc8; --c3: #4a9a3d; --c4: #d9a514; --c5: #8a5cb8; --c6: #e07b2e; --c7: #8b5a3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg-base); color: var(--text); font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    .page { max-width: 480px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; height: 100%; }
    header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; padding: 8px 12px; box-shadow: 0 4px 6px -1px rgba(15,23,42,.12); }
    header strong { font-size: 1.15rem; }
    .badge { display: flex; flex-direction: column; align-items: center; background: var(--bg-slot); border: 1px solid var(--border); border-radius: 12px; padding: 3px 14px; min-width: 70px; }
    .badge span { font-size: .65rem; color: var(--muted); }
    .badge b { font-size: 1.15rem; color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }
    .badge.pop { animation: pop .45s ease; }
    h1 { font-size: 1.1rem; text-align: center; margin-top: 8px; }
    p.note { text-align: center; color: var(--muted); font-size: .85rem; }
    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .choice { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--bg-surface); font: inherit; text-align: start; cursor: pointer; box-shadow: 0 2px 6px rgba(15,23,42,.06); }
    .choice:active { transform: scale(.98); }
    .choice .n { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
    .choice b { display: block; font-size: 1rem; }
    .choice small { color: var(--muted); font-size: .8rem; }

    .pic { width: 70%; height: 70%; }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

    /* shared: a frosted light veil, not a dark screen */
    .veil { position: fixed; inset: 0; z-index: 50; background: rgba(238, 242, 247, .78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fadeIn .25s ease; }
    .veil.out { animation: fadeOut .35s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes fadeOut { to { opacity: 0; } }
    .caption { position: fixed; left: 0; right: 0; z-index: 60; text-align: center; pointer-events: none; }
    .caption b { display: block; font-size: 1.6rem; font-weight: 900; }
    .caption small { color: var(--muted); font-size: .95rem; }
    .caption.in { animation: capIn .45s cubic-bezier(.3,1.5,.5,1) backwards; }
    @keyframes capIn { from { opacity: 0; transform: translateY(12px) scale(.9); } }

    /* ---------- 1: flipping tiles ---------- */
    .a-grid { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 60; display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; padding: 14px; background: var(--bg-surface); border-radius: 24px; box-shadow: 0 20px 40px rgba(15,23,42,.18); }
    .a-tile { width: 76px; height: 76px; border-radius: 16px; background: var(--bg-slot); display: flex; align-items: center; justify-content: center; animation: tileIn .45s cubic-bezier(.3,1.6,.5,1) backwards; }
    .a-grid.wave .a-tile:not(.a-center) { animation: wave .5s ease; }
    @keyframes tileIn { from { transform: scale(0) rotate(-20deg); opacity: 0; } }
    @keyframes wave { 50% { transform: translateY(-10px) scale(1.06); } }
    .a-center { perspective: 400px; background: transparent; }
    .a-flip { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,1.3,.5,1); }
    .a-center.flip .a-flip { transform: rotateY(180deg); }
    .a-face { position: absolute; inset: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .a-front { background: var(--bg-slot); }
    .a-back { background: var(--accent); color: #fff; font-size: 2.4rem; font-weight: 900; transform: rotateY(180deg); box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--accent); }

    /* ---------- 2: the badge flies ---------- */
    .b-badge { position: fixed; z-index: 60; display: flex; flex-direction: column; align-items: center; background: var(--bg-surface); border: 2px solid var(--accent); border-radius: 12px; padding: 3px 14px; min-width: 70px; transition: transform .55s cubic-bezier(.3,1.3,.5,1); box-shadow: 0 10px 30px rgba(37,99,235,.25); transform-origin: center; }
    .b-badge span { font-size: .65rem; color: var(--muted); }
    .b-roll { height: 1.4rem; overflow: hidden; font-size: 1.15rem; font-weight: 800; color: var(--accent); line-height: 1.4rem; }
    .b-roll div { transition: transform .7s cubic-bezier(.3,1.4,.5,1); }
    .b-roll.go div { transform: translateY(-1.4rem); }
    .b-ribbon { position: fixed; left: 50%; z-index: 61; transform: translateX(-50%) scaleX(0); background: var(--accent); color: #fff; font-weight: 800; padding: 8px 34px; font-size: 1.05rem; clip-path: polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%, 8% 50%); transition: transform .45s cubic-bezier(.3,1.5,.5,1); white-space: nowrap; }
    .b-ribbon.open { transform: translateX(-50%) scaleX(1); }
    .bit { position: fixed; top: -20px; z-index: 55; width: 12px; height: 12px; border-radius: 4px; pointer-events: none; animation: fall var(--t) cubic-bezier(.3,.4,.6,1) forwards; }
    @keyframes fall { to { transform: translate(var(--sway), 105vh) rotate(var(--rot)); } }

    /* ---------- 3: the wheel ---------- */
    .c-disc { position: fixed; left: 50%; bottom: 0; z-index: 56; width: 460px; height: 460px; margin-left: -230px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--border); box-shadow: 0 -8px 30px rgba(15,23,42,.15); transform: translateY(100%); transition: transform .5s cubic-bezier(.3,1.2,.5,1); }
    .c-disc.up { transform: translateY(52%); }
    .c-disc.down { transform: translateY(100%); transition-duration: .4s; }
    .c-ring { position: absolute; inset: 0; border-radius: 50%; }
    .c-ring.spin { animation: spinOnce 1.5s cubic-bezier(.2,.7,.25,1) forwards; }
    @keyframes spinOnce { to { transform: rotate(var(--turn)); } }
    .c-item { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 14px; background: var(--bg-slot); display: flex; align-items: center; justify-content: center; }
    .c-frame { position: fixed; left: 50%; z-index: 60; width: 108px; height: 108px; margin-left: -54px; border-radius: 22px; background: var(--bg-surface); border: 4px solid var(--accent); box-shadow: 0 12px 30px rgba(37,99,235,.3); display: flex; align-items: center; justify-content: center; font-size: 3.2rem; font-weight: 900; color: var(--accent); animation: frameIn .5s cubic-bezier(.3,1.7,.5,1) backwards; }
    @keyframes frameIn { from { transform: scale(0) rotate(15deg); opacity: 0; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="p-house" viewBox="0 0 100 100">
            <rect x="66" y="16" width="11" height="22" rx="2" fill="currentColor"/>
            <path d="M6 52 L50 12 L94 52 Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
            <rect x="17" y="46" width="66" height="46" rx="4" fill="currentColor"/>
            <path d="M6 52 L50 12 L94 52" stroke="#1e293b" stroke-opacity=".22" stroke-width="5" fill="none" stroke-linejoin="round"/>
            <rect x="26" y="57" width="15" height="14" rx="2" fill="#fff"/>
            <rect x="52" y="62" width="17" height="30" rx="3" fill="#fff"/>
            <circle cx="64" cy="78" r="2" fill="currentColor"/>
        </symbol>
        <symbol id="p-cat" viewBox="0 0 100 100">
            <path d="M10 56 L16 6 L46 30 Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
            <path d="M90 56 L84 6 L54 30 Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
            <path d="M21 34 L22 17 L34 27 Z" fill="#fff" opacity=".5"/>
            <path d="M79 34 L78 17 L66 27 Z" fill="#fff" opacity=".5"/>
            <ellipse cx="50" cy="61" rx="40" ry="33" fill="currentColor"/>
            <ellipse cx="35" cy="56" rx="5" ry="6.5" fill="#1e293b"/><ellipse cx="65" cy="56" rx="5" ry="6.5" fill="#1e293b"/>
            <circle cx="36.5" cy="53.5" r="1.7" fill="#fff"/><circle cx="66.5" cy="53.5" r="1.7" fill="#fff"/>
            <path d="M44.5 68 L55.5 68 L50 74 Z" fill="#fff"/>
            <path d="M18 69 L36 72 M18 78 L36 76 M82 69 L64 72 M82 78 L64 76" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        </symbol>
        <symbol id="p-fish" viewBox="0 0 100 100">
            <path d="M68 50 L96 26 L92 50 L96 74 Z" fill="currentColor" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
            <path d="M34 30 Q46 14 58 30 Z" fill="currentColor"/>
            <ellipse cx="42" cy="50" rx="36" ry="24" fill="currentColor"/>
            <path d="M52 34 Q60 50 52 66" stroke="#fff" stroke-opacity=".55" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle cx="24" cy="45" r="7.5" fill="#fff"/><circle cx="23" cy="45" r="3.8" fill="#1e293b"/>
            <path d="M8 56 Q13 60 18 57" stroke="#1e293b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        </symbol>
        <symbol id="p-tree" viewBox="0 0 100 100">
            <rect x="42" y="56" width="16" height="40" rx="4" fill="currentColor"/>
            <rect x="42" y="56" width="16" height="40" rx="4" fill="#1e293b" opacity=".35"/>
            <g fill="currentColor">
                <circle cx="50" cy="32" r="26"/><circle cx="27" cy="48" r="20"/><circle cx="73" cy="48" r="20"/><circle cx="50" cy="54" r="20"/>
            </g>
            <circle cx="36" cy="34" r="4.5" fill="#fff" opacity=".6"/><circle cx="64" cy="42" r="4.5" fill="#fff" opacity=".6"/><circle cx="48" cy="58" r="4.5" fill="#fff" opacity=".6"/>
        </symbol>
        <symbol id="p-umbrella" viewBox="0 0 100 100">
            <path d="M50 48 L50 82 Q50 93 40 93 Q31 93 31 84" stroke="currentColor" stroke-width="7" fill="none" stroke-linecap="round"/>
            <path d="M5 52 Q50 -6 95 52 Q84 43 72.5 52 Q61 43 50 52 Q39 43 27.5 52 Q16 43 5 52 Z" fill="currentColor"/>
            <path d="M50 10 Q38 30 27.5 50 M50 10 Q62 30 72.5 50" stroke="#fff" stroke-opacity=".55" stroke-width="3.5" fill="none"/>
            <circle cx="50" cy="9" r="4" fill="currentColor"/>
        </symbol>
        <symbol id="p-kid" viewBox="0 0 100 100">
            <path d="M12 100 Q12 66 50 66 Q88 66 88 100 Z" fill="currentColor"/>
            <circle cx="50" cy="40" r="25" fill="currentColor"/>
            <circle cx="50" cy="45" r="19" fill="#fff"/>
            <path d="M26 38 Q34 18 50 22 Q66 18 74 38 Q62 30 50 32 Q38 30 26 38 Z" fill="currentColor"/>
            <circle cx="43" cy="45" r="3.2" fill="#1e293b"/><circle cx="57" cy="45" r="3.2" fill="#1e293b"/>
            <path d="M43 53 Q50 59 57 53" stroke="#1e293b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        </symbol>
        <symbol id="p-car" viewBox="0 0 100 100">
            <path d="M24 50 L34 27 Q36 23 41 23 L62 23 Q67 23 69 27 L80 50 Z" fill="currentColor"/>
            <rect x="4" y="46" width="92" height="28" rx="10" fill="currentColor"/>
            <path d="M31 48 L38 30 L48 30 L48 48 Z" fill="#fff"/>
            <path d="M53 30 L63 30 L71 48 L53 48 Z" fill="#fff"/>
            <rect x="85" y="53" width="8" height="6" rx="2" fill="#fff"/>
            <circle cx="27" cy="76" r="11" fill="#1e293b"/><circle cx="73" cy="76" r="11" fill="#1e293b"/>
            <circle cx="27" cy="76" r="4.5" fill="#fff"/><circle cx="73" cy="76" r="4.5" fill="#fff"/>
        </symbol>
    </defs>
</svg>
<div class="page">
    <header>
        <strong>קלוקס</strong>
        <div class="badge" id="badge"><span>רמה</span><b id="badgeNum">6</b></div>
    </header>
    <h1>איזו אנימציה של עליית רמה?</h1>
    <p class="note">לחץ כדי לראות כל אחת. אפשר כמה פעמים.</p>
    <div class="choices">
        <button class="choice" data-v="1"><span class="n">1</span><span><b>אריחים מתהפכים</b><small>לוח קטן קופץ, האריח האמצעי מתהפך למספר החדש</small></span></button>
        <button class="choice" data-v="2"><span class="n">2</span><span><b>התג עף</b><small>תג הרמה עף למרכז, המספר מתגלגל, סרט וקונפטי</small></span></button>
        <button class="choice" data-v="3"><span class="n">3</span><span><b>גלגל מסתובב</b><small>גלגל הציורים עולה, מסתובב ועוצר על המספר</small></span></button>
    </div>
</div>
<script>
    const COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)', 'var(--c7)'];
    const PICS = ['house', 'cat', 'fish', 'tree', 'umbrella', 'kid', 'car'];
    const NS = 'http://www.w3.org/2000/svg';
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    let level = 6, busy = false;

    function pic(name, color) {
        const s = document.createElementNS(NS, 'svg');
        s.setAttribute('viewBox', '0 0 100 100');
        s.setAttribute('class', 'pic');
        s.style.color = color;
        const u = document.createElementNS(NS, 'use');
        u.setAttribute('href', '#p-' + name);
        s.appendChild(u);
        return s;
    }
    function el(cls, parent = document.body, tag = 'div') {
        const e = document.createElement(tag);
        e.className = cls;
        parent.appendChild(e);
        return e;
    }

    // --- the game's sounds, so each option is heard as it would be ---
    let ctx = null;
    function tone(f, { type = 'sine', dur = .12, vol = .14, delay = 0, slideTo = null } = {}) {
        try {
            ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
            const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
            o.type = type; o.frequency.setValueAtTime(f, t);
            if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
            o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + .02);
        } catch (e) {}
    }
    const fanfare = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, { type: 'triangle', dur: .2, vol: .11, delay: i * .08 }));
    const pip = k => tone(600 * Math.pow(2, k / 12), { dur: .07, vol: .07, slideTo: 900 * Math.pow(2, k / 12) });

    function bumpBadge() {
        level++;
        document.getElementById('badgeNum').innerText = level;
        const b = document.getElementById('badge');
        b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
    }
    async function finish(nodes, veil) {
        veil.classList.add('out');
        nodes.forEach(n => { n.style.transition = 'opacity .3s ease'; n.style.opacity = 0; });
        await sleep(350);
        nodes.forEach(n => n.remove());
        veil.remove();
    }

    // 1 — flipping tiles
    async function flipTiles() {
        const veil = el('veil');
        const grid = el('a-grid');
        let center;
        for (let i = 0; i < 9; i++) {
            const t = el('a-tile', grid);
            t.style.animationDelay = (i * 55) + 'ms';
            if (i === 4) {
                t.classList.add('a-center');
                const flip = el('a-flip', t);
                el('a-face a-front', flip).appendChild(pic('cat', 'var(--c2)'));
                el('a-face a-back', flip).innerText = level + 1;
                center = t;
            } else {
                t.appendChild(pic(PICS[(i * 3) % 7], COLORS[(i * 5) % 7]));
            }
            setTimeout(() => pip(i), i * 55);
        }
        const cap = el('caption');
        cap.style.top = 'calc(42% + 150px)';
        await sleep(700);
        center.classList.add('flip');
        tone(880, { dur: .3, slideTo: 1760, vol: .1 });
        await sleep(350);
        fanfare();
        grid.classList.add('wave');
        [...grid.children].forEach((t, i) => { if (t !== center) t.style.animationDelay = (i * 60) + 'ms'; });
        cap.innerHTML = '<b>עלית רמה!</b><small>מתחיל → חד</small>';
        cap.classList.add('in');
        bumpBadge();
        await sleep(1700);
        await finish([grid, cap], veil);
    }

    // 2 — the badge flies to the middle, rolls its number, a ribbon opens
    async function badgeFlies() {
        const src = document.getElementById('badge').getBoundingClientRect();
        const veil = el('veil');
        const b = el('b-badge');
        b.style.left = src.left + 'px';
        b.style.top = src.top + 'px';
        b.innerHTML = `<span>רמה</span><div class="b-roll"><div>${level}</div><div>${level + 1}</div></div>`;
        const dx = innerWidth / 2 - (src.left + src.width / 2);
        const dy = innerHeight * .4 - (src.top + src.height / 2);
        await sleep(30);
        b.style.transform = `translate(${dx}px, ${dy}px) scale(2.6)`;
        tone(440, { dur: .35, slideTo: 990, vol: .09 });
        await sleep(600);
        b.querySelector('.b-roll').classList.add('go');
        await sleep(350);
        fanfare();
        const rib = el('b-ribbon');
        rib.innerText = 'רמה חדשה!';
        rib.style.top = (innerHeight * .4 + 70) + 'px';
        await sleep(20);
        rib.classList.add('open');
        for (let i = 0; i < 46; i++) {
            const c = el('bit');
            c.style.left = (Math.random() * 100) + 'vw';
            c.style.background = COLORS[i % 7];
            c.style.setProperty('--t', (1.6 + Math.random() * 1.2) + 's');
            c.style.setProperty('--sway', (Math.random() * 80 - 40) + 'px');
            c.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
            c.style.animationDelay = (Math.random() * .4) + 's';
            if (i % 3 === 0) c.style.borderRadius = '50%';
            setTimeout(() => c.remove(), 3400);
        }
        await sleep(1500);
        rib.style.transition = 'opacity .25s ease';
        rib.style.opacity = 0;
        b.style.transform = 'translate(0, 0) scale(1)';
        await sleep(520);
        bumpBadge();
        tone(1320, { dur: .12, vol: .08 });
        b.remove(); rib.remove();
        veil.classList.add('out');
        await sleep(350);
        veil.remove();
    }

    // 3 — the wheel rises, turns once and stops on the new number
    async function wheelSpins() {
        const veil = el('veil');
        const disc = el('c-disc');
        const ring = el('c-ring', disc);
        const R = 175;
        const n = 14;
        for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2;
            const it = el('c-item', ring);
            it.style.transform = `translate(${Math.sin(a) * R}px, ${-Math.cos(a) * R}px)`;
            it.appendChild(pic(PICS[i % 7], COLORS[(i * 3) % 7]));
        }
        await sleep(30);
        disc.classList.add('up');
        await sleep(450);
        ring.style.setProperty('--turn', '-360deg');
        ring.classList.add('spin');
        for (let k = 0; k < 12; k++) setTimeout(() => tone(2400, { type: 'triangle', dur: .025, vol: .04 }), k * k * 9);
        await sleep(1450);
        const discTop = innerHeight - 460 * .48;
        const frame = el('c-frame');
        frame.style.top = (discTop - 150) + 'px';
        frame.innerText = level + 1;
        fanfare();
        const cap = el('caption in');
        cap.style.top = (discTop - 230) + 'px';
        cap.innerHTML = '<b>עלית רמה!</b>';
        bumpBadge();
        await sleep(1500);
        disc.classList.remove('up');
        disc.classList.add('down');
        await finish([frame, cap], veil);
        await sleep(100);
        disc.remove();
    }

    const RUN = { 1: flipTiles, 2: badgeFlies, 3: wheelSpins };
    document.querySelectorAll('.choice').forEach(btn => btn.addEventListener('click', async () => {
        if (busy) return;
        busy = true;
        try { await RUN[btn.dataset.v](); } finally { busy = false; }
    }));
</script>
</body>
</html>
