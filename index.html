<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1120">
    <title>Klox</title>
    <script>
        // Apply the saved theme before first paint, so light mode never flashes dark.
        (function () {
            let t = null;
            try { t = localStorage.getItem('klox_theme'); } catch (e) {}
            if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <style>
        /* ============================
           Variables & Theming
           ============================ */
        :root {
            /* Dark Theme Colors (default) */
            --bg-base: #0b1120;
            --bg-surface: #1e293b;
            --bg-slot: #0f172a;
            --bg-locked: rgba(255, 255, 255, 0.03);
            --border-color: #334155;
            --border-highlight: #64748b;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            --color-red: #f43f5e;
            --color-blue: #38bdf8;
            --color-green: #10b981;

            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;

            --shadow: rgba(0, 0, 0, 0.35);
            --overlay: rgba(0, 0, 0, 0.7);
        }

        :root[data-theme="light"] {
            --bg-base: #eef2f7;
            --bg-surface: #ffffff;
            --bg-slot: #e2e8f0;
            --bg-locked: rgba(15, 23, 42, 0.06);
            --border-color: #cbd5e1;
            --border-highlight: #94a3b8;

            --text-main: #0f172a;
            --text-muted: #64748b;

            --color-red: #e11d48;
            --color-blue: #0284c7;
            --color-green: #059669;

            --accent: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;

            --shadow: rgba(15, 23, 42, 0.15);
            --overlay: rgba(15, 23, 42, 0.45);
        }

        /* ============================
           Global Reset & Layout
           ============================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            height: 100%;
            padding: 12px;
            gap: 14px;
        }

        /* ============================
           Header & Status
           ============================ */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 10px 12px;
            flex-shrink: 0;
            box-shadow: 0 4px 6px -1px var(--shadow);
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .icon-btn {
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: var(--border-highlight);
        }

        .level-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 12px;
            position: relative;
            min-width: 76px;
        }

        .level-badge span { font-size: 0.7rem; color: var(--text-muted); }
        .level-badge strong { font-size: 1.25rem; color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }
        .level-badge .peak { font-size: 0.65rem; }
        .level-badge.up { animation: badgeUp 0.9s ease; }
        .level-badge.down { animation: badgeDown 0.9s ease; }

        @keyframes badgeUp {
            0% { transform: scale(1); }
            30% { transform: scale(1.18); box-shadow: 0 0 18px var(--success); border-color: var(--success); }
            100% { transform: scale(1); }
        }
        @keyframes badgeDown {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); border-color: var(--danger); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(2px); }
        }

        .level-delta {
            position: absolute;
            top: -10px;
            inset-inline-start: 50%;
            transform: translateX(50%);
            font-size: 0.8rem;
            font-weight: 800;
            pointer-events: none;
            animation: floatUp 1.4s ease forwards;
        }
        .level-delta.pos { color: var(--success); }
        .level-delta.neg { color: var(--danger); }
        @keyframes floatUp {
            0% { opacity: 0; translate: 0 6px; }
            20% { opacity: 1; }
            100% { opacity: 0; translate: 0 -22px; }
        }

        .app-title {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .app-title strong { font-size: 1.2rem; display: flex; align-items: center; gap: 6px; }
        .app-title span { font-size: 0.75rem; color: var(--text-muted); }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            flex-shrink: 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .timer {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            color: var(--text-main);
            font-size: 1.1rem;
        }
        .timer.danger { color: var(--danger); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ============================
           Chips (Rules)
           ============================ */
        .chips {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .chip {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            transition: 0.3s ease;
        }

        .chip::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-color);
            transition: 0.3s ease;
        }

        .chip.valid { color: var(--text-main); border-color: var(--success); }
        .chip.valid::before { background: var(--success); box-shadow: 0 0 8px var(--success); }

        /* ============================
           Board Layout
           ============================ */
        .board-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 0; /* Important for flex child to shrink properly */
            position: relative;
            container-type: size; /* lets the board size itself to the smaller side */
        }

        .board-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 16px;
            width: min(100cqw, 100cqh, 400px);
            aspect-ratio: 1 / 1;
            box-shadow: 0 10px 30px var(--shadow);
            transition: filter 0.3s ease;
        }

        .board-container.paused {
            filter: grayscale(100%) blur(8px);
            pointer-events: none;
        }

        /* CSS Grid strictly dividing the space for dots and slots */
        /* RTL: 24px track for dots on the LEFT (column 4) */
        .board-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 24px;
            grid-template-rows: 24px 1fr 1fr 1fr;
            gap: 10px;
            width: 100%;
            height: 100%;
        }

        .board-grid.no-guides .dot { visibility: hidden; }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-color);
            justify-self: center;
            align-self: center;
            transition: 0.3s ease;
        }
        .dot.valid {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            transform: scale(1.2);
        }

        /* ============================
           Slots & Tiles
           ============================ */
        .slot {
            width: 100%;
            height: 100%;
            background: var(--bg-slot);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            position: relative; /* Anchor for absolute children */
            overflow: hidden; /* Prevent ANY visual escape */
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .slot.locked {
            background: var(--bg-locked);
        }

        .slot.drop-ok {
            border: 2px dashed var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, var(--bg-slot));
        }
        .slot.drop-bad {
            border: 2px dashed var(--danger);
        }

        .tile {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            border-radius: 14px;
            border: 3px solid transparent;
            transition: transform 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
            box-sizing: border-box;
            touch-action: none; /* lets a finger drag the tile instead of scrolling */
        }

        .tile.locked-tile { cursor: default; }
        .tile:not(.locked-tile):active { transform: scale(0.95); }

        .tile.selected {
            border-color: var(--text-main);
            transform: scale(0.92);
            box-shadow: 0 4px 15px var(--shadow);
            z-index: 10;
        }

        .tile.drag-origin { opacity: 0.25; }
        .tile.pop { animation: pop 0.28s ease; }
        .tile.shake { animation: shake 0.35s ease; }

        @keyframes pop {
            0% { transform: scale(0.6); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }

        .drag-ghost {
            position: fixed;
            z-index: 200;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            background: var(--bg-surface);
            border: 2px solid var(--accent);
            box-shadow: 0 12px 28px var(--shadow);
            transform: translate(-50%, -50%) scale(1.12) rotate(-4deg);
            transition: transform 0.12s ease;
        }

        .lock-svg {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 14px;
            height: 14px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        /* ============================
           Shapes (Pure CSS)
           ============================ */
        .shape {
            width: 45%;
            height: 45%;
        }

        .shape.square { border-radius: 8px; }

        .shape.circle { border-radius: 50%; }

        .shape.triangle {
            width: 52%;
            height: 52%;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            /* Background color injected via inline style */
        }

        /* ============================
           Tray Area
           ============================ */
        .tray-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 14px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 8px;
            transition: border-color 0.15s ease;
        }

        .tray-container.drop-ok { border: 2px dashed var(--accent); }

        .tray-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .tray-count {
            background: var(--bg-slot);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Wraps instead of scrolling: a sideways-scrolling tray fights with dragging. */
        .tray-slots {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            min-height: 56px;
        }

        .tray-slot {
            flex-shrink: 0;
            width: 56px;
            aspect-ratio: 1 / 1;
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            position: relative;
            overflow: hidden;
        }

        .tray-empty {
            color: var(--text-muted);
            font-size: 0.85rem;
            align-self: center;
        }

        /* ============================
           Modals
           ============================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 24px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 40px var(--shadow);
            animation: pop 0.25s ease;
        }

        .modal-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 12px; }
        .modal-msg { font-size: 1rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; white-space: pre-line; }

        .level-change {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-weight: 800;
            font-size: 1.15rem;
            font-variant-numeric: tabular-nums;
        }
        .level-change .nums { white-space: nowrap; font-size: 1.3rem; }
        .level-change .tag {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--bg-slot);
            color: var(--text-muted);
        }
        .level-change .tag.fast { color: var(--warning); }
        .level-change .tag.ceiling { color: var(--accent); }
        .level-change .tag.drop { color: var(--danger); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: 0.2s ease;
            margin-bottom: 10px;
        }

        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); }
        .btn-secondary { background: var(--bg-slot); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

        /* ============================
           Confetti
           ============================ */
        .confetti {
            position: fixed;
            top: 40%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 150;
            animation: confetti 1.2s cubic-bezier(.2,.7,.4,1) forwards;
        }
        @keyframes confetti {
            0% { transform: translate(0, 0) rotate(0); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header>
        <div class="header-actions">
            <button class="icon-btn" id="settingsBtn" aria-label="הגדרות">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <button class="icon-btn" id="pauseBtn" aria-label="השהה/המשך">
                <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
                <svg id="icon-play" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </button>
            <button class="icon-btn" id="themeBtn" aria-label="מצב כהה/בהיר">
                <!-- Sun: shown in dark mode (tap for light) -->
                <svg id="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
                <!-- Moon: shown in light mode (tap for dark) -->
                <svg id="icon-moon" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <button class="icon-btn" id="soundBtn" aria-label="צלילים">
                <svg id="icon-sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
                <svg id="icon-sound-off" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
            </button>
        </div>
        <div class="level-badge" id="levelBadge">
            <span>מדד רמה</span>
            <strong id="levelDisplay">1.0</strong>
            <span class="peak">שיא <span id="peakDisplay">1.0</span></span>
        </div>
        <div class="app-title">
            <strong>קלוקס</strong>
            <span id="rankTitle">חושב מתחיל</span>
        </div>
    </header>

    <!-- Status Bar -->
    <div class="status-bar">
        <span>לוח 3x3</span>
        <span>זמן שנותר: <span class="timer" id="timerDisplay">02:00</span></span>
        <span>צעדים: <span id="stepsDisplay">0</span></span>
    </div>

    <!-- Rule Chips -->
    <div class="chips">
        <div class="chip" id="chipRows">שורות שונות</div>
        <div class="chip" id="chipCols">עמודות שונות</div>
        <div class="chip" id="chipUnique">זוגות ייחודיים</div>
    </div>

    <!-- Board Area -->
    <div class="board-wrapper">
        <div class="board-container" id="boardContainer">
            <div class="board-grid" id="boardGrid">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- Tray Area -->
    <div class="tray-container" id="trayContainer" data-drop="tray">
        <div class="tray-header">
            <span>מגש אריחים</span>
            <span class="tray-count" id="trayCountDisplay">0 נותרו</span>
        </div>
        <div class="tray-slots" id="traySlots">
            <!-- Generated by JS -->
        </div>
    </div>
</div>

<!-- Modal Dialog -->
<div class="modal-overlay" id="dialogModal">
    <div class="modal-content" id="dialogContent">
        <h2 class="modal-title" id="dialogTitle">הודעה</h2>
        <p class="modal-msg" id="dialogMessage"></p>
        <div class="level-change" id="dialogLevel" style="display: none;"></div>
        <div id="dialogButtons"></div>
    </div>
</div>

<script>
    /* ============================
       Storage (never throws: private windows can refuse it)
       ============================ */
    const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    };

    /* ============================
       Sound — tiny synthesised bleeps, no audio files
       ============================ */
    const Sound = {
        ctx: null,
        enabled: store.get('klox_sound') !== 'off',

        ensure() {
            if (!this.enabled) return null;
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                this.ctx = new AC();
            }
            if (this.ctx.state === 'suspended') this.ctx.resume();
            return this.ctx;
        },

        tone(freq, { type = 'sine', dur = 0.12, vol = 0.16, delay = 0, slideTo = null } = {}) {
            const ctx = this.ensure();
            if (!ctx) return;
            const t0 = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
            // Fast attack, soft exponential tail: reads as a "plink", not a beep.
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.02);
        },

        pick()  { this.tone(620, { dur: 0.09, slideTo: 940, vol: 0.13 }); },
        drop()  { this.tone(880, { type: 'triangle', dur: 0.11, slideTo: 520 }); this.tone(1320, { dur: 0.06, vol: 0.05, delay: 0.03 }); },
        swap()  { this.tone(700, { type: 'triangle', dur: 0.07 }); this.tone(940, { type: 'triangle', dur: 0.08, delay: 0.07 }); },
        back()  { this.tone(740, { dur: 0.1, slideTo: 420, vol: 0.12 }); },
        select(){ this.tone(1040, { dur: 0.05, vol: 0.08 }); },
        nope()  { this.tone(220, { type: 'square', dur: 0.09, vol: 0.05 }); this.tone(185, { type: 'square', dur: 0.12, vol: 0.05, delay: 0.09 }); },
        tick()  { this.tone(1500, { dur: 0.03, vol: 0.04 }); },
        line()  { [784, 988, 1175].forEach((f, i) => this.tone(f, { dur: 0.16, vol: 0.1, delay: i * 0.06 })); },
        win()   {
            [523, 659, 784, 1047].forEach((f, i) => this.tone(f, { type: 'triangle', dur: 0.22, vol: 0.14, delay: i * 0.09 }));
            [1568, 2093, 2637].forEach((f, i) => this.tone(f, { dur: 0.12, vol: 0.05, delay: 0.42 + i * 0.07 }));
        },
        lose()  { [523, 440, 349].forEach((f, i) => this.tone(f, { type: 'triangle', dur: 0.25, vol: 0.12, delay: i * 0.14 })); },
        levelUp()   { this.tone(440, { dur: 0.35, slideTo: 1320, vol: 0.1 }); this.tone(1760, { dur: 0.15, vol: 0.05, delay: 0.3 }); },
        levelDown() { this.tone(520, { type: 'triangle', dur: 0.4, slideTo: 260, vol: 0.1 }); },
    };

    function buzz(pattern) {
        if (Sound.enabled && navigator.vibrate) navigator.vibrate(pattern);
    }

    /* ============================
       Theme & sound toggles
       ============================ */
    function applyThemeUI() {
        const light = document.documentElement.dataset.theme === 'light';
        document.getElementById('icon-sun').style.display = light ? 'none' : 'block';
        document.getElementById('icon-moon').style.display = light ? 'block' : 'none';
        document.querySelector('meta[name="theme-color"]').content = light ? '#eef2f7' : '#0b1120';
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        document.documentElement.dataset.theme = next;
        store.set('klox_theme', next);
        applyThemeUI();
        Sound.select();
    });

    function applySoundUI() {
        document.getElementById('icon-sound-on').style.display = Sound.enabled ? 'block' : 'none';
        document.getElementById('icon-sound-off').style.display = Sound.enabled ? 'none' : 'block';
    }

    document.getElementById('soundBtn').addEventListener('click', () => {
        Sound.enabled = !Sound.enabled;
        store.set('klox_sound', Sound.enabled ? 'on' : 'off');
        applySoundUI();
        Sound.select();
    });

    /* ============================
       Adaptive difficulty

       The level is a continuous rating from 1.0 to 10.0. After every board:
       - A win that was clearly easy (fast and with few wasted moves) jumps the
         level up, and consecutive easy wins jump further each time — so a
         player who is far below their ability gets there in a few boards.
       - Below the player's peak, wins climb back quickly.
       - At the peak, ordinary wins are heavily damped: the player has to win
         well, repeatedly, to push the peak higher. That is the "stuck at your
         ceiling" feeling.
       - A loss drops the level, and consecutive losses drop it further, so a
         player who is over their head comes down fast.
       ============================ */
    const MIN_LEVEL = 1.0;
    const MAX_LEVEL = 10.0;

    let level = parseFloat(store.get('klox_level')) || 1.0;
    let progress = (() => {
        try {
            const p = JSON.parse(store.get('klox_progress'));
            if (p && typeof p.peak === 'number') return p;
        } catch (e) {}
        return { peak: level, easyStreak: 0, failStreak: 0, played: 0 };
    })();

    function saveProgress() {
        store.set('klox_level', level.toFixed(2));
        store.set('klox_progress', JSON.stringify(progress));
    }

    // What a level means on the board.
    function levelParams(L) {
        return {
            // Tiles you must place: 3 at level 1, all 9 from about level 9.6
            missing: Math.min(9, Math.round(3 + (L - 1) * 0.7)),
            // From level 5.5, some of those start on the board in the wrong place (unlocked)
            scrambled: L >= 5.5 ? Math.min(3, Math.floor((L - 4) / 1.5)) : 0,
            // Less time as the level rises: 150s at 1, 42s at 10
            time: Math.max(40, Math.round(150 - (L - 1) * 12)),
            // The per-row/column dots go away from level 7 — you must check lines yourself
            guides: L < 7,
        };
    }

    function rankFor(L) {
        if (L >= 9) return 'מחונן';
        if (L >= 7) return 'מומחה';
        if (L >= 5) return 'חד';
        if (L >= 3) return 'מתקדם';
        return 'חושב מתחיל';
    }

    // Returns { before, after, delta, tag } and updates level/progress.
    function applyResult(won, stats) {
        const before = level;
        const atCeiling = before >= progress.peak - 0.05;
        let delta;
        let tag;

        if (won) {
            progress.failStreak = 0;
            // 0..1: mostly speed, some move efficiency
            const perf = 0.6 * (1 - stats.timeFrac) + 0.4 * stats.efficiency;

            if (perf >= 0.72) {
                progress.easyStreak++;
                delta = 0.4 + 0.2 * Math.min(3, progress.easyStreak - 1); // 0.4, 0.6, 0.8, 1.0
                tag = 'fast';
            } else {
                progress.easyStreak = 0;
                delta = perf >= 0.45 ? 0.2 : 0.08;
                if (atCeiling) {
                    delta *= 0.4; // the grind at the top
                    tag = 'ceiling';
                } else {
                    delta *= 1.5; // recovering ground you already proved
                    // ...but only up to the peak; anything past it is damped like the grind
                    const over = before + delta - progress.peak;
                    if (over > 0) delta -= over * 0.6;
                    tag = 'up';
                }
            }
        } else {
            progress.easyStreak = 0;
            progress.failStreak++;
            delta = -Math.min(1.0, 0.25 + 0.15 * (progress.failStreak - 1));
            tag = 'drop';
        }

        level = Math.min(MAX_LEVEL, Math.max(MIN_LEVEL, Math.round((before + delta) * 100) / 100));
        progress.peak = Math.max(progress.peak, level);
        progress.played++;
        saveProgress();
        return { before, after: level, delta: level - before, tag };
    }

    /* ============================
       State
       ============================ */
    const colors = ['var(--color-red)', 'var(--color-blue)', 'var(--color-green)'];
    const shapes = ['square', 'circle', 'triangle'];

    let boardState = Array(9).fill(null); // null or {color, shape, locked, id}
    let trayState = [];                   // [{color, shape, id}]
    let params = levelParams(level);
    let minSteps = 0;

    let selectedSource = null; // 'board' | 'tray' | null
    let selectedId = null;     // tray tile id
    let selectedIndex = null;  // board index
    let steps = 0;
    let gameOver = false;
    let validLines = new Set();
    let popIndex = null;       // board index to animate on next render

    /* ============================
       Timer
       ============================ */
    let totalTime = params.time;
    let timeLeft = totalTime;
    let timerInterval = null;
    let isPaused = false;

    function formatTime(s) {
        const m = Math.floor(s / 60).toString().padStart(2, '0');
        const sc = (s % 60).toString().padStart(2, '0');
        return `${m}:${sc}`;
    }

    function updateTimerUI() {
        const el = document.getElementById('timerDisplay');
        el.innerText = formatTime(timeLeft);
        el.classList.toggle('danger', timeLeft <= Math.min(30, Math.floor(totalTime / 4)));
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (isPaused || gameOver) return;
            timeLeft--;
            updateTimerUI();
            if (timeLeft > 0 && timeLeft <= 10) Sound.tick();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame(false);
            }
        }, 1000);
    }

    function setPaused(p) {
        isPaused = p;
        document.getElementById('boardContainer').classList.toggle('paused', p);
        document.getElementById('icon-pause').style.display = p ? 'none' : 'block';
        document.getElementById('icon-play').style.display = p ? 'block' : 'none';
        if (p) clearInterval(timerInterval);
        else if (!gameOver) startTimer();
    }

    document.getElementById('pauseBtn').addEventListener('click', () => {
        if (gameOver) return;
        cancelDrag();
        setPaused(!isPaused);
        Sound.select();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden && !isPaused && !gameOver) { cancelDrag(); setPaused(true); }
    });

    /* ============================
       Modal
       ============================ */
    // buttons: [{ label, cls, action }]
    function showDialog(title, msg, buttons, levelHtml = null) {
        document.getElementById('dialogTitle').innerText = title;
        document.getElementById('dialogMessage').innerText = msg;
        const lv = document.getElementById('dialogLevel');
        lv.style.display = levelHtml ? 'flex' : 'none';
        lv.innerHTML = levelHtml || '';

        const modal = document.getElementById('dialogModal');
        const box = document.getElementById('dialogButtons');
        box.innerHTML = '';
        buttons.forEach(b => {
            const el = document.createElement('button');
            el.className = 'btn ' + (b.cls || 'btn-primary');
            el.innerText = b.label;
            el.onclick = () => { modal.style.display = 'none'; Sound.select(); if (b.action) b.action(); };
            box.appendChild(el);
        });
        modal.style.display = 'flex';
    }

    document.getElementById('settingsBtn').addEventListener('click', () => {
        if (gameOver) return;
        cancelDrag();
        const wasPaused = isPaused;
        if (!isPaused) setPaused(true);
        showDialog('הגדרות', `רמה ${level.toFixed(1)} · שיא ${progress.peak.toFixed(1)} · ${progress.played} לוחות`, [
            { label: 'המשך לשחק', cls: 'btn-primary', action: () => { if (!wasPaused) setPaused(false); } },
            { label: 'קשה מדי — דלג (נחשב הפסד)', cls: 'btn-secondary', action: () => endGame(false, true) },
            { label: 'איפוס התקדמות', cls: 'btn-danger', action: () => {
                showDialog('לאפס הכול?', 'הרמה והשיא יחזרו ל־1.0.', [
                    { label: 'כן, לאפס', cls: 'btn-danger', action: () => {
                        level = 1.0;
                        progress = { peak: 1.0, easyStreak: 0, failStreak: 0, played: 0 };
                        saveProgress();
                        initLevel();
                    } },
                    { label: 'ביטול', cls: 'btn-secondary', action: () => { if (!wasPaused) setPaused(false); } },
                ]);
            } },
        ]);
    });

    /* ============================
       Puzzle generation
       ============================ */
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // A random pair of orthogonal 3x3 Latin squares. Permuting rows, columns and
    // symbols (and transposing) keeps every row, column and pair distinct, so each
    // board has a fresh solution instead of the same one every time.
    function generateValidBoard() {
        const rows = shuffle([0, 1, 2]);
        const cols = shuffle([0, 1, 2]);
        const colorMap = shuffle([...colors]);
        const shapeMap = shuffle([...shapes]);
        const transpose = Math.random() < 0.5;
        const flip = Math.random() < 0.5;

        const solution = [];
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
                let rr = rows[r], cc = cols[c];
                if (transpose) [rr, cc] = [cc, rr];
                const a = (rr + cc) % 3;
                const b = (rr + 2 * cc) % 3;
                solution.push({
                    color: colorMap[flip ? b : a],
                    shape: shapeMap[flip ? a : b],
                });
            }
        }
        return solution;
    }

    function initLevel() {
        selectedSource = null;
        selectedId = null;
        selectedIndex = null;
        steps = 0;
        gameOver = false;
        popIndex = null;

        params = levelParams(level);
        totalTime = params.time;
        timeLeft = totalTime;
        updateTimerUI();

        document.getElementById('levelDisplay').innerText = level.toFixed(1);
        document.getElementById('peakDisplay').innerText = progress.peak.toFixed(1);
        document.getElementById('rankTitle').innerText = rankFor(level);
        document.getElementById('stepsDisplay').innerText = steps;
        document.getElementById('boardGrid').classList.toggle('no-guides', !params.guides);

        const solution = generateValidBoard();
        const order = shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]);
        const missingPos = order.slice(0, params.missing);

        boardState = Array(9).fill(null);
        trayState = [];
        let idCounter = 1;

        order.forEach((pos, i) => {
            const item = { ...solution[pos], id: 't_' + idCounter++ };
            if (i < params.missing) {
                trayState.push(item);
            } else {
                item.locked = true;
                boardState[pos] = item;
            }
        });

        // Scrambled: some of the missing tiles start on the board, in a wrong slot.
        const s = Math.min(params.scrambled, missingPos.length - 1);
        if (s > 0) {
            const from = missingPos.slice(0, s);
            // Rotate them among their own slots, or (one tile) put it in another empty slot
            const to = s >= 2 ? [...from.slice(1), from[0]] : [missingPos[1]];
            from.forEach((p, k) => {
                const want = solution[p];
                const idx = trayState.findIndex(t => t.color === want.color && t.shape === want.shape);
                boardState[to[k]] = trayState.splice(idx, 1)[0];
            });
        }

        // Roughly the fewest moves a perfect player needs
        minSteps = params.missing;

        shuffle(trayState);
        validLines = new Set();
        render(true);
        setPaused(false);
    }

    /* ============================
       Rendering
       ============================ */
    function createTileElement(data, isSelected) {
        const tile = document.createElement('div');
        tile.className = 'tile' + (isSelected ? ' selected' : '') + (data.locked ? ' locked-tile' : '');

        const shape = document.createElement('div');
        shape.className = 'shape ' + data.shape;
        shape.style.backgroundColor = data.color; // inline so clip-path shapes are coloured
        tile.appendChild(shape);

        if (data.locked) {
            const lock = document.createElement('div');
            lock.innerHTML = `<svg class="lock-svg" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;
            tile.appendChild(lock.firstChild);
        }
        return tile;
    }

    function render(silent = false) {
        // 1. Tray
        const trayEl = document.getElementById('traySlots');
        trayEl.innerHTML = '';
        trayState.forEach((item) => {
            const slot = document.createElement('div');
            slot.className = 'tray-slot';
            const isSel = selectedSource === 'tray' && selectedId === item.id;
            const tile = createTileElement(item, isSel);
            tile.dataset.src = 'tray';
            tile.dataset.id = item.id;
            tile.addEventListener('click', (e) => { e.stopPropagation(); handleTrayClick(item.id); });
            slot.appendChild(tile);
            trayEl.appendChild(slot);
        });
        if (trayState.length === 0) {
            const empty = document.createElement('span');
            empty.className = 'tray-empty';
            empty.innerText = 'המגש ריק — גרור לכאן אריח כדי להחזיר אותו';
            trayEl.appendChild(empty);
        }
        document.getElementById('trayCountDisplay').innerText = `${trayState.length} נותרו`;

        // 2. Board
        const grid = document.getElementById('boardGrid');
        grid.innerHTML = '';

        for (let c = 0; c < 3; c++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-col-${c}`;
            dot.style.gridRow = '1';
            dot.style.gridColumn = `${c + 1}`;
            grid.appendChild(dot);
        }

        boardState.forEach((item, index) => {
            const r = Math.floor(index / 3);
            const c = index % 3;

            if (c === 0) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.id = `dot-row-${r}`;
                dot.style.gridRow = `${r + 2}`;
                dot.style.gridColumn = '4';
                grid.appendChild(dot);
            }

            const slot = document.createElement('div');
            slot.className = 'slot' + (item?.locked ? ' locked' : '');
            slot.style.gridRow = `${r + 2}`;
            slot.style.gridColumn = `${c + 1}`;
            slot.dataset.drop = 'board';
            slot.dataset.index = index;

            if (item) {
                const isSel = selectedSource === 'board' && selectedIndex === index;
                const tile = createTileElement(item, isSel);
                if (popIndex === index) tile.classList.add('pop');
                if (!item.locked) {
                    tile.dataset.src = 'board';
                    tile.dataset.index = index;
                }
                tile.addEventListener('click', (e) => { e.stopPropagation(); handleBoardClick(index, tile); });
                slot.appendChild(tile);
            } else {
                slot.addEventListener('click', () => handleBoardClick(index, slot));
            }
            grid.appendChild(slot);
        });
        popIndex = null;

        validateState(silent);
    }

    /* ============================
       Moves (shared by tap and drag)
       ============================ */
    function placeFromTray(id, index) {
        const tIdx = trayState.findIndex(t => t.id === id);
        if (tIdx < 0 || boardState[index]?.locked) return false;
        const item = trayState.splice(tIdx, 1)[0];
        if (boardState[index]) trayState.push(boardState[index]); // occupant goes back
        boardState[index] = item;
        steps++;
        popIndex = index;
        Sound.drop();
        buzz(8);
        return true;
    }

    function moveOnBoard(from, to) {
        if (from === to) return false;
        if (boardState[to]?.locked || boardState[from]?.locked) return false;
        const hadOccupant = !!boardState[to];
        [boardState[from], boardState[to]] = [boardState[to], boardState[from]];
        steps++;
        popIndex = to;
        hadOccupant ? Sound.swap() : Sound.drop();
        buzz(8);
        return true;
    }

    function returnToTray(index) {
        const item = boardState[index];
        if (!item || item.locked) return false;
        boardState[index] = null;
        trayState.push(item);
        steps++;
        Sound.back();
        return true;
    }

    function rejectMove(el) {
        Sound.nope();
        buzz([20, 40, 20]);
        if (el) {
            el.classList.remove('shake');
            void el.offsetWidth;
            el.classList.add('shake');
        }
    }

    function clearSelection() {
        selectedSource = null;
        selectedId = null;
        selectedIndex = null;
    }

    function afterMove() {
        document.getElementById('stepsDisplay').innerText = steps;
        render();
    }

    /* ============================
       Tap interactions
       ============================ */
    function handleTrayClick(id) {
        if (isPaused || gameOver) return;
        if (selectedSource === 'tray' && selectedId === id) {
            clearSelection();
        } else {
            selectedSource = 'tray';
            selectedId = id;
            selectedIndex = null;
            Sound.select();
        }
        render();
    }

    function handleBoardClick(index, el) {
        if (isPaused || gameOver) return;
        const item = boardState[index];

        if (item?.locked) {
            if (selectedSource) rejectMove(el);
            return;
        }

        if (selectedSource === 'tray') {
            placeFromTray(selectedId, index);
            clearSelection();
        } else if (selectedSource === 'board') {
            if (selectedIndex === index) {
                // Second tap on the same tile sends it back to the tray
                returnToTray(index);
            } else {
                moveOnBoard(selectedIndex, index);
            }
            clearSelection();
        } else if (item) {
            // Select a placed tile: next tap moves/swaps it, or tap it again to return it
            selectedSource = 'board';
            selectedIndex = index;
            Sound.select();
            render();
            return;
        } else {
            return;
        }
        afterMove();
    }

    // Tapping the tray while a board tile is selected sends that tile back
    document.getElementById('trayContainer').addEventListener('click', () => {
        if (isPaused || gameOver || selectedSource !== 'board') return;
        returnToTray(selectedIndex);
        clearSelection();
        afterMove();
    });

    /* ============================
       Drag & drop (pointer events: mouse, touch and pen alike)
       ============================ */
    const DRAG_THRESHOLD = 6; // px before a press becomes a drag rather than a tap
    let drag = null;
    let suppressClickUntil = 0;

    document.addEventListener('pointerdown', (e) => {
        if (isPaused || gameOver || e.button > 0 || drag) return;
        const tile = e.target.closest('.tile[data-src]');
        if (!tile) return;
        drag = {
            src: tile.dataset.src,
            id: tile.dataset.id,
            index: tile.dataset.index !== undefined ? +tile.dataset.index : null,
            el: tile,
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            ghost: null,
            target: null,
        };
    });

    document.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        if (!drag.ghost) {
            if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < DRAG_THRESHOLD) return;
            startDragVisual();
        }
        e.preventDefault();
        drag.ghost.style.left = e.clientX + 'px';
        drag.ghost.style.top = e.clientY + 'px';
        updateDropTarget(e.clientX, e.clientY);
    }, { passive: false });

    document.addEventListener('pointerup', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        if (!drag.ghost) { drag = null; return; } // a tap — the click handler takes it
        const target = drag.target;
        const d = drag;
        cancelDrag();
        suppressClickUntil = performance.now() + 400;
        performDrop(d, target);
    });

    document.addEventListener('pointercancel', (e) => {
        if (drag && e.pointerId === drag.pointerId) cancelDrag();
    });

    // A drag ends with a click on whatever was under the finger; swallow it.
    document.addEventListener('click', (e) => {
        if (performance.now() < suppressClickUntil) {
            e.stopPropagation();
            e.preventDefault();
        }
    }, true);

    function startDragVisual() {
        const rect = drag.el.getBoundingClientRect();
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.style.width = rect.width + 'px';
        ghost.style.height = rect.height + 'px';
        const shape = drag.el.querySelector('.shape').cloneNode(true);
        ghost.appendChild(shape);
        document.body.appendChild(ghost);
        drag.ghost = ghost;
        drag.el.classList.add('drag-origin');
        clearSelection();
        document.querySelectorAll('.tile.selected').forEach(t => t.classList.remove('selected'));
        Sound.pick();
        buzz(5);
    }

    function clearDropHighlights() {
        document.querySelectorAll('.drop-ok, .drop-bad').forEach(el => el.classList.remove('drop-ok', 'drop-bad'));
    }

    function updateDropTarget(x, y) {
        clearDropHighlights();
        const el = document.elementFromPoint(x, y);
        const zone = el && el.closest('[data-drop]');
        drag.target = null;
        if (!zone) return;

        if (zone.dataset.drop === 'board') {
            const idx = +zone.dataset.index;
            const ok = !boardState[idx]?.locked && !(drag.src === 'board' && drag.index === idx);
            zone.classList.add(ok ? 'drop-ok' : 'drop-bad');
            drag.target = { kind: 'board', index: idx, ok, el: zone };
        } else if (zone.dataset.drop === 'tray' && drag.src === 'board') {
            zone.classList.add('drop-ok');
            drag.target = { kind: 'tray', ok: true, el: zone };
        }
    }

    function performDrop(d, target) {
        if (!target) { render(); return; } // dropped nowhere: snap back
        if (!target.ok) { render(); rejectMove(document.querySelector(`.slot[data-index="${target.index}"]`)); return; }

        let moved = false;
        if (target.kind === 'board') {
            moved = d.src === 'tray' ? placeFromTray(d.id, target.index) : moveOnBoard(d.index, target.index);
        } else if (target.kind === 'tray') {
            moved = returnToTray(d.index);
        }
        if (moved) afterMove(); else render();
    }

    function cancelDrag() {
        if (!drag) return;
        if (drag.ghost) drag.ghost.remove();
        drag.el.classList.remove('drag-origin');
        clearDropHighlights();
        drag = null;
    }

    /* ============================
       Validation
       ============================ */
    function validateState(silent = false) {
        let rowsV = true, colsV = true;
        const uniquePairs = new Set();
        const nowValid = new Set();

        for (let i = 0; i < 3; i++) {
            const rColors = new Set(), rShapes = new Set();
            let rCount = 0;
            for (let c = 0; c < 3; c++) {
                const item = boardState[i * 3 + c];
                if (item) {
                    rColors.add(item.color); rShapes.add(item.shape); rCount++;
                    uniquePairs.add(item.color + item.shape);
                }
            }
            const rv = (rCount === 3 && rColors.size === 3 && rShapes.size === 3);
            document.getElementById(`dot-row-${i}`).className = 'dot' + (rv ? ' valid' : '');
            if (rv) nowValid.add('r' + i); else rowsV = false;

            const cColors = new Set(), cShapes = new Set();
            let cCount = 0;
            for (let r = 0; r < 3; r++) {
                const item = boardState[r * 3 + i];
                if (item) { cColors.add(item.color); cShapes.add(item.shape); cCount++; }
            }
            const cv = (cCount === 3 && cColors.size === 3 && cShapes.size === 3);
            document.getElementById(`dot-col-${i}`).className = 'dot' + (cv ? ' valid' : '');
            if (cv) nowValid.add('c' + i); else colsV = false;
        }

        const uniqV = (uniquePairs.size === 9);

        document.getElementById('chipRows').className = 'chip' + (rowsV ? ' valid' : '');
        document.getElementById('chipCols').className = 'chip' + (colsV ? ' valid' : '');
        document.getElementById('chipUnique').className = 'chip' + (uniqV ? ' valid' : '');

        const won = rowsV && colsV && uniqV && trayState.length === 0;

        // A little chime when a line newly completes — only where the guides are shown,
        // or it would give away what the hidden dots hide.
        if (!silent && !won && params.guides && [...nowValid].some(k => !validLines.has(k))) {
            setTimeout(() => Sound.line(), 90);
        }
        validLines = nowValid;

        if (won && !gameOver) endGame(true);
    }

    /* ============================
       End of a board
       ============================ */
    function confetti() {
        const palette = ['var(--color-red)', 'var(--color-blue)', 'var(--color-green)', 'var(--warning)', 'var(--accent)'];
        for (let i = 0; i < 36; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            const angle = Math.random() * Math.PI * 2;
            const dist = 120 + Math.random() * 160;
            c.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
            c.style.setProperty('--dy', Math.sin(angle) * dist + 120 + 'px');
            c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
            c.style.background = palette[i % palette.length];
            c.style.borderRadius = i % 3 === 0 ? '50%' : '3px';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 1300);
        }
    }

    function showLevelChange(res) {
        const badge = document.getElementById('levelBadge');
        badge.classList.remove('up', 'down');
        void badge.offsetWidth;
        if (Math.abs(res.delta) < 0.005) return;
        badge.classList.add(res.delta > 0 ? 'up' : 'down');
        const d = document.createElement('span');
        d.className = 'level-delta ' + (res.delta > 0 ? 'pos' : 'neg');
        d.dir = 'ltr';
        d.innerText = (res.delta > 0 ? '+' : '−') + Math.abs(res.delta).toFixed(2);
        badge.appendChild(d);
        setTimeout(() => d.remove(), 1500);
        document.getElementById('levelDisplay').innerText = res.after.toFixed(1);
        document.getElementById('peakDisplay').innerText = progress.peak.toFixed(1);
    }

    function levelChangeHtml(res) {
        const tags = {
            fast: '⚡ קל לך מדי — קפיצה',
            up: '↗ חוזר לשיא',
            ceiling: '⛰ ליד השיא — כל צעד קשה',
            drop: '↘ יורדים קצת',
        };
        const sign = res.delta >= 0 ? '+' : '−';
        return `<span class="nums">${res.before.toFixed(1)} ← ${res.after.toFixed(1)}</span>`
            + `<span class="tag ${res.tag}"><bdi dir="ltr">${sign}${Math.abs(res.delta).toFixed(2)}</bdi> · ${tags[res.tag]}</span>`;
    }

    // won: solved the board. skipped: gave up from settings.
    function endGame(won, skipped = false) {
        if (gameOver) return;
        gameOver = true;
        cancelDrag();
        clearInterval(timerInterval);

        const stats = {
            timeFrac: (totalTime - timeLeft) / totalTime,
            efficiency: steps > 0 ? Math.min(1, minSteps / steps) : 1,
        };
        const res = applyResult(won, stats);
        const newRecord = won && res.after > res.before && res.after >= progress.peak && res.before < progress.peak;

        setTimeout(() => {
            if (won) {
                Sound.win();
                confetti();
                buzz([30, 50, 30]);
            } else {
                Sound.lose();
            }
            setTimeout(() => {
                showLevelChange(res);
                if (res.delta > 0.005) Sound.levelUp(); else if (res.delta < -0.005) Sound.levelDown();
            }, 450);

            const usedSec = totalTime - timeLeft;
            let title, msg;
            if (won) {
                title = newRecord ? 'שיא חדש! 🏆' : 'אלופה! 🧩';
                msg = `פתרת את הלוח תוך ${steps} צעדים ו־${usedSec} שניות.`;
            } else if (skipped) {
                title = 'דילגת על הלוח';
                msg = 'נוריד קצת את הרמה ונמשיך.';
            } else {
                title = 'הזמן נגמר! ⏰';
                msg = 'לא הספקת לפתור את הלוח בזמן. הלוח הבא יהיה קצת יותר קל.';
            }
            showDialog(title, msg, [{ label: 'ללוח הבא', cls: 'btn-primary', action: initLevel }], levelChangeHtml(res));
        }, won ? 300 : 0);
    }

    // Startup
    applyThemeUI();
    applySoundUI();
    initLevel();
</script>
